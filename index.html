<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Awake">
<link rel="apple-touch-icon" sizes="180x180" href="awake-icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="awake-icon-180.png">
<title>Awake</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --fg:#fff;
  --muted:#8d8d94;
  --line:#ffffff2b;
  --panel:#000000d6;
  --soft:#ffffff14;
  --b:max(env(safe-area-inset-bottom),12px);
  --l:max(env(safe-area-inset-left),12px);
  --r:max(env(safe-area-inset-right),12px);
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
button,input{font:inherit;color:inherit}

#stars{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}

#vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle,transparent 38%,#0002 78%,#0009 100%);
}

#clock{
  position:fixed;
  z-index:3;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:100%;
  padding:0 20px;
  text-align:center;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 2px 22px #000,0 0 3px #000;
}
#time{
  font-size:clamp(48px,15vw,104px);
  font-weight:200;
  letter-spacing:-.055em;
  line-height:.9;
  font-variant-numeric:tabular-nums;
}
#date{
  margin-top:14px;
  font-size:clamp(14px,4vw,22px);
  opacity:.72;
}

#sitTime{
  margin-top:8px;
  font-size:clamp(12px,3.2vw,17px);
  font-weight:700;
  letter-spacing:.02em;
  color:#7dff98;
  opacity:0;
  transition:.2s ease;
}
#sitTime.visible{opacity:.92}

#controls{
  position:fixed;
  z-index:8;
  left:var(--l);
  right:var(--r);
  bottom:calc(var(--b) + 82px);
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  transition:.28s ease;
}
#controls.hidden{
  transform:translateY(calc(100% + 14px));
  opacity:0;
  pointer-events:none;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.head strong{
  font-size:12px;
  letter-spacing:.03em;
}
.actions{
  display:flex;
  gap:14px;
}
.text{
  border:0;
  background:transparent;
  padding:4px 0;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
#reset{color:var(--fg)}

.sliders{
  display:grid;
  gap:8px;
}
.ctrl{
  display:grid;
  grid-template-columns:68px 1fr 34px;
  gap:8px;
  align-items:center;
}
.ctrl label,.ctrl output{
  font-size:10px;
  color:var(--muted);
}
.ctrl output{text-align:right}

.voiceSelect{
  grid-template-columns:68px minmax(0,1fr) 34px;
}
.voiceSelect select{
  width:100%;
  min-width:0;
  height:30px;
  padding:0 28px 0 9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#ffffff10;
  color:var(--fg);
  font-size:10px;
  outline:none;
}
.voiceSelect select:focus{
  border-color:#77bfff;
  box-shadow:0 0 0 3px #77bfff20;
}
.voiceSelect option{color:#000;background:#fff}
#voicePreview{
  width:30px;
  height:30px;
  padding:0;
  border:1px solid #77bfff88;
  border-radius:50%;
  background:#77bfff20;
  color:#9bd1ff;
  display:grid;
  place-items:center;
  cursor:pointer;
}
#voicePreview:active{
  background:#77bfff42;
  color:#d8efff;
}
#voicePreview svg{
  width:13px;
  height:13px;
  fill:currentColor;
}

.toggleRow{
  display:flex;
  align-items:center;
  justify-content:flex-end;
}
.switch{
  position:relative;
  width:42px;
  height:24px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffff12;
  cursor:pointer;
}
.switch::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#8d8d94;
  transition:.2s ease;
}
.switch.active{
  background:#32aef52b;
  border-color:#32aef58f;
}
.switch.active::after{
  transform:translateX(18px);
  background:#69c7ff;
  box-shadow:0 0 12px #32aef5aa;
}

input[type=range]{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  height:20px;
  background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;
  background:var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;
  height:16px;
  margin-top:-7px;
  border:0;
  border-radius:50%;
  background:var(--fg);
  box-shadow:0 0 0 4px var(--soft);
}

#show{
  position:fixed;
  z-index:9;
  left:50%;
  bottom:calc(var(--b) + 86px);
  transform:translateX(-50%);
  display:none;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
}
#show.visible{display:none}

#bottom{
  position:fixed;
  z-index:10;
  left:0;
  right:0;
  bottom:var(--b);
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

#bottomCluster{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#controlsButton{
  position:absolute;
  left:calc(50% - 74px);
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:1px solid #79cfff;
  border-radius:50%;
  background:#79cfff;
  color:#06141d;
  display:grid;
  place-items:center;
  pointer-events:auto;
  box-shadow:0 8px 24px #0008;
  transition:.18s ease;
}
#controlsButton svg{
  width:14px;
  height:14px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#controlsButton.active{
  border-color:#32aef5;
  background:#32aef5;
  color:#001019;
  box-shadow:0 0 0 5px #32aef52b,0 0 30px #32aef57a;
  transform:translateY(-50%) scale(1.04);
}

#alarm{
  position:absolute;
  left:calc(50% + 42px);
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:1px solid #f6c945;
  border-radius:50%;
  background:#f6c945;
  color:#171200;
  display:grid;
  place-items:center;
  pointer-events:auto;
  box-shadow:0 8px 24px #0008;
  transition:.18s ease;
}
#alarm svg{
  width:14px;
  height:14px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#alarm.active{
  border-color:#56e47b;
  background:#56e47b;
  color:#06170b;
  box-shadow:0 0 0 5px #56e47b2b,0 0 30px #56e47b7a;
  transform:translateY(-50%) scale(1.04);
}

#power{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:64px;
  height:64px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#000;
  display:grid;
  place-items:center;
  pointer-events:auto;
  box-shadow:0 10px 30px #0008;
}
#power svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
}
#power.active{
  background:var(--fg);
  color:var(--bg);
  box-shadow:0 0 0 5px var(--soft),0 0 34px var(--line);
}
#ring{
  position:absolute;
  inset:-5px;
  border:1px solid transparent;
  border-radius:50%;
}
#power.active #ring{
  border-color:var(--line);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  50%{transform:scale(1.08);opacity:.3}
}

#note{
  position:fixed;
  z-index:20;
  top:max(env(safe-area-inset-top),12px);
  left:50%;
  transform:translate(-50%,-8px);
  max-width:calc(100vw - 28px);
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  font-size:11px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}
#note.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media (orientation:landscape){
  #time{font-size:clamp(44px,10vw,82px)}
  #controls{
    left:calc(var(--l) + 5vw);
    right:calc(var(--r) + 5vw);
    bottom:calc(var(--b) + 62px);
  }
  .sliders{
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .ctrl{
    grid-template-columns:50px 1fr 26px;
  }
  #bottom{height:58px}
  #power{
    width:52px;
    height:52px;
  }
  #controlsButton{
    left:calc(50% - 60px);
    width:26px;
    height:26px;
  }
  #controlsButton svg{
    width:12px;
    height:12px;
  }
  #alarm{
    left:calc(50% + 34px);
    width:26px;
    height:26px;
  }
  #alarm svg{
    width:12px;
    height:12px;
  }
}

</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="vignette"></div>

<div id="note"></div>

<div id="clock">
  <div id="time">12:00</div>
  <div id="date">Jul 20, 2026</div>
  <div id="sitTime" aria-live="polite"></div>
</div>

<section id="controls">
  <div class="head">
    <strong>Stars</strong>
    <div class="actions">
      <button id="reset" class="text" type="button">Reset</button>
      <button id="hide" class="text" type="button">Hide</button>
    </div>
  </div>
  <div class="sliders">
    <div class="ctrl">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0" max="100">
      <output id="speedOut"></output>
    </div>
    <div class="ctrl">
      <label for="intensity">Intensity</label>
      <input id="intensity" type="range" min="0" max="100">
      <output id="intensityOut"></output>
    </div>
    <div class="ctrl">
      <label for="brightness">Brightness</label>
      <input id="brightness" type="range" min="10" max="100">
      <output id="brightnessOut"></output>
    </div>
    <div class="ctrl">
      <label for="reminder">Reminder</label>
      <input id="reminder" type="range" min="0" max="3" step="1">
      <output id="reminderOut"></output>
    </div>
    <div class="ctrl">
      <label for="clockAlertsToggle">:00 / :30</label>
      <div class="toggleRow">
        <button id="clockAlertsToggle" class="switch" type="button" aria-label="Toggle hour and half-hour time announcements" aria-pressed="true"></button>
      </div>
      <output id="clockAlertsOut">On</output>
    </div>
    <div class="ctrl voiceSelect">
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect" aria-label="Select reminder voice">
        <option value="">Default voice</option>
      </select>
      <button id="voicePreview" type="button" aria-label="Preview selected voice" title="Preview voice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      </button>
    </div>
  </div>
</section>


<div id="bottom">
  <div id="bottomCluster">
    <button id="controlsButton" type="button" aria-label="Toggle controls" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h10"></path>
        <path d="M18 7h2"></path>
        <circle cx="16" cy="7" r="2"></circle>
        <path d="M4 17h2"></path>
        <path d="M10 17h10"></path>
        <circle cx="8" cy="17" r="2"></circle>
      </svg>
    </button>
    <button id="power" type="button" aria-label="Toggle wake mode">
      <span id="ring"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.8v8.4"></path>
        <path d="M7.15 5.75a8 8 0 1 0 9.7 0"></path>
      </svg>
    </button>
    <button id="alarm" type="button" aria-label="Toggle sitting time reminder" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6.5 8.2A6.4 6.4 0 0 1 12 5a6.4 6.4 0 0 1 5.5 3.2c.7 1.2 1 2.6 1 4v2.3l1.4 2.3H4.1l1.4-2.3v-2.3c0-1.4.3-2.8 1-4Z"></path>
        <path d="M9.5 19a2.8 2.8 0 0 0 5 0"></path>
        <path d="M5.1 4.6 3.3 6.4"></path>
        <path d="m18.9 4.6 1.8 1.8"></path>
      </svg>
    </button>
  </div>
</div>

<script>
(()=>{
  "use strict";

  const $ = s => document.querySelector(s);
  const canvas = $("#stars");
  const ctx = canvas.getContext("2d", {alpha:false});

  const E = {
    note: $("#note"),
    power: $("#power"),
    controls: $("#controls"),
    controlsButton: $("#controlsButton"),
    hide: $("#hide"),
    reset: $("#reset"),
    speed: $("#speed"),
    intensity: $("#intensity"),
    brightness: $("#brightness"),
    reminder: $("#reminder"),
    clockAlertsToggle: $("#clockAlertsToggle"),
    clockAlertsOut: $("#clockAlertsOut"),
    voiceSelect: $("#voiceSelect"),
    voicePreview: $("#voicePreview"),
    alarm: $("#alarm"),
    speedOut: $("#speedOut"),
    intensityOut: $("#intensityOut"),
    brightnessOut: $("#brightnessOut"),
    reminderOut: $("#reminderOut"),
    time: $("#time"),
    date: $("#date"),
    sitTime: $("#sitTime")
  };

  const REMINDER_MINUTES = [5,10,15,20];
  const DEFAULTS = {speed:52,intensity:62,brightness:82,reminderIndex:1,clockAlerts:true,voiceName:""};

  let prefs = {};
  try{
    prefs = JSON.parse(localStorage.getItem("awakeStarsPreferences") || "{}");
  }catch{}

  const settings = {
    speed: Number.isFinite(+prefs.speed) ? +prefs.speed : DEFAULTS.speed,
    intensity: Number.isFinite(+prefs.intensity) ? +prefs.intensity : DEFAULTS.intensity,
    brightness: Number.isFinite(+prefs.brightness) ? +prefs.brightness : DEFAULTS.brightness,
    reminderIndex: Number.isFinite(+prefs.reminderIndex) ? Math.max(0,Math.min(3,Math.round(+prefs.reminderIndex))) : DEFAULTS.reminderIndex,
    clockAlerts: typeof prefs.clockAlerts === "boolean" ? prefs.clockAlerts : DEFAULTS.clockAlerts,
    voiceName: typeof prefs.voiceName === "string" ? prefs.voiceName : DEFAULTS.voiceName
  };

  let controlsHidden = !!prefs.controlsHidden;
  let w = 1, h = 1, dpr = 1;
  let stars = [];
  let last = performance.now();
  let wakeLock = null;
  let wakeWanted = false;
  let noteTimer = 0;
  let reminderOn = !!prefs.reminderOn;
  let sittingStartedAt = Number.isFinite(+prefs.sittingStartedAt) ? +prefs.sittingStartedAt : 0;
  let reminderTimer = 0;
  let clockAnnouncementTimer = 0;
  let lastClockSpokenAt = 0;
  let lastClockAnnouncementKey = prefs.lastClockAnnouncementKey || "";
  let availableVoices = [];

  if(reminderOn && !sittingStartedAt){
    sittingStartedAt = Date.now();
  }

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const rnd = (a,b) => a + Math.random() * (b-a);

  function save(){
    try{
      localStorage.setItem("awakeStarsPreferences", JSON.stringify({
        ...settings,
        controlsHidden,
        reminderOn,
        sittingStartedAt,
        lastClockAnnouncementKey
      }));
    }catch{}
  }

  function note(text, duration=3000){
    E.note.textContent = text;
    E.note.classList.add("show");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(()=>E.note.classList.remove("show"), duration);
  }

  function clear(){
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,w,h);
  }

  function makeStar(randomDepth=false){
    return {
      px:rnd(-w,w),
      py:rnd(-h,h),
      z:randomDepth ? rnd(1,w) : w,
      pz:w
    };
  }

  function initStars(){
    const count = Math.floor(80 + settings.intensity * 2.3);
    stars = Array.from({length:count}, ()=>makeStar(true));
  }

  function drawStars(dt){
    ctx.fillStyle = "rgba(0,0,0,.42)";
    ctx.fillRect(0,0,w,h);

    const cx = w/2;
    const cy = h/2;
    const movement = (45 + settings.speed * 6) * dt / 1000;

    ctx.lineCap = "round";

    for(const star of stars){
      star.pz = star.z;
      star.z -= movement;

      if(star.z < 1){
        Object.assign(star, makeStar(false));
      }

      const x = cx + star.px / star.z * w * .45;
      const y = cy + star.py / star.z * h * .45;
      const px = cx + star.px / star.pz * w * .45;
      const py = cy + star.py / star.pz * h * .45;

      if(x < 0 || x > w || y < 0 || y > h){
        Object.assign(star, makeStar(false));
        continue;
      }

      const depth = 1 - star.z / w;
      const alpha = clamp(depth * settings.brightness / 75, .08, 1);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = clamp(depth * 3.2, .4, 3.2) * (.45 + settings.intensity / 120);
      ctx.beginPath();
      ctx.moveTo(px,py);
      ctx.lineTo(x,y);
      ctx.stroke();
    }
  }

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);

    canvas.width = Math.round(w*dpr);
    canvas.height = Math.round(h*dpr);
    canvas.style.width = w+"px";
    canvas.style.height = h+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
    clear();
    initStars();
  }

  function syncControls(){
    for(const name of ["speed","intensity","brightness"]){
      E[name].value = settings[name];
      E[name+"Out"].value = settings[name];
    }
    E.reminder.value = settings.reminderIndex;
    E.reminderOut.value = REMINDER_MINUTES[settings.reminderIndex] + "m";
    E.clockAlertsToggle.classList.toggle("active", settings.clockAlerts);
    E.clockAlertsToggle.setAttribute("aria-pressed", String(settings.clockAlerts));
    E.clockAlertsOut.value = settings.clockAlerts ? "On" : "Off";
    if(E.voiceSelect) E.voiceSelect.value = availableVoices.some(v=>v.name===settings.voiceName) ? settings.voiceName : "";
    E.controls.classList.toggle("hidden", controlsHidden);
    E.controlsButton.classList.toggle("active", !controlsHidden);
    E.controlsButton.setAttribute("aria-pressed", String(!controlsHidden));
  }

  function formatSittingTime(ms){
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    if(hours > 0) return `${hours}h ${String(minutes).padStart(2,"0")}m ${String(seconds).padStart(2,"0")}s`;
    return `${minutes}m ${String(seconds).padStart(2,"0")}s`;
  }

  function updateSittingDisplay(){
    if(!reminderOn || !sittingStartedAt){
      E.sitTime.textContent = "";
      E.sitTime.classList.remove("visible");
      return;
    }
    E.sitTime.textContent = formatSittingTime(Date.now() - sittingStartedAt);
    E.sitTime.classList.add("visible");
  }

  function updateClock(){
    const now = new Date();
    E.time.textContent = now
      .toLocaleTimeString([], {hour:"numeric",minute:"2-digit",hour12:true})
      .replace(" AM","")
      .replace(" PM","");
    E.date.textContent = now.toLocaleDateString("en-US", {
      month:"short",
      day:"numeric",
      year:"numeric"
    });
  }

  for(const name of ["speed","intensity","brightness"]){
    E[name].addEventListener("input", ()=>{
      settings[name] = +E[name].value;
      E[name+"Out"].value = settings[name];

      if(name === "intensity"){
        initStars();
      }
      save();
    });
  }

  E.reminder.addEventListener("input", ()=>{
    settings.reminderIndex = Math.max(0,Math.min(3,Math.round(+E.reminder.value)));
    E.reminderOut.value = REMINDER_MINUTES[settings.reminderIndex] + "m";
    save();

    if(reminderOn){
      scheduleReminder();
      note(`Reminder set to every ${REMINDER_MINUTES[settings.reminderIndex]} minutes`);
    }
  });

  E.clockAlertsToggle.addEventListener("click", ()=>{
    settings.clockAlerts = !settings.clockAlerts;
    syncControls();
    save();
    clearTimeout(clockAnnouncementTimer);
    clockAnnouncementTimer = 0;
    if(reminderOn && settings.clockAlerts){
      scheduleClockAnnouncement();
    }
    note(settings.clockAlerts ? "Hour / half-hour alerts on" : "Hour / half-hour alerts off");
  });

  E.voiceSelect.addEventListener("change", ()=>{
    settings.voiceName = E.voiceSelect.value;
    save();
  });

  E.voicePreview.addEventListener("click", ()=>{
    const voice = selectedVoice();
    speakText(voice ? "This is the selected Awake voice." : "This is the default Awake voice.", 3500);
  });

  function refreshVoices(){
    if(!("speechSynthesis" in window) || !E.voiceSelect) return;
    const voices = speechSynthesis.getVoices();
    if(!voices.length) return;
    availableVoices = voices.slice().sort((a,b)=>{
      const ae = /^en(-|_)/i.test(a.lang) ? 0 : 1;
      const be = /^en(-|_)/i.test(b.lang) ? 0 : 1;
      return ae-be || a.name.localeCompare(b.name);
    });
    const previous = settings.voiceName;
    E.voiceSelect.innerHTML = '<option value="">Default voice</option>';
    for(const voice of availableVoices){
      const option = document.createElement("option");
      option.value = voice.name;
      option.textContent = `${voice.name} · ${voice.lang}`;
      E.voiceSelect.appendChild(option);
    }
    if(previous && availableVoices.some(v=>v.name===previous)){
      E.voiceSelect.value = previous;
    }else{
      if(previous){
        settings.voiceName = "";
        save();
      }
      E.voiceSelect.value = "";
    }
  }

  function selectedVoice(){
    if(!settings.voiceName) return null;
    return availableVoices.find(v=>v.name===settings.voiceName) || null;
  }

  function applyVoice(utterance){
    const voice = selectedVoice();
    if(voice){
      utterance.voice = voice;
      utterance.lang = voice.lang || utterance.lang;
    }
  }

  function spokenElapsed(){
    const totalMinutes = Math.max(1, Math.round((Date.now() - sittingStartedAt) / 60000));
    if(totalMinutes < 60) return `${totalMinutes} minute${totalMinutes === 1 ? "" : "s"}`;
    const hours = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;
    return mins
      ? `${hours} hour${hours === 1 ? "" : "s"} and ${mins} minute${mins === 1 ? "" : "s"}`
      : `${hours} hour${hours === 1 ? "" : "s"}`;
  }

  function speakText(text, duration=4500){
    note(text, duration);
    try{
      if("speechSynthesis" in window){
        // Do not cancel here. iPhone may deliver timers a little late, and cancel()
        // could erase a sitting reminder when a :00/:30 announcement lands nearby.
        // Let Web Speech queue the utterances in order instead.
        const utterance = new SpeechSynthesisUtterance(text);
        applyVoice(utterance);
        utterance.rate = 0.95;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
      }
    }catch{}
  }

  function speakReminder(){
    // Every configured sitting interval must announce. Never suppress it just
    // because a clock announcement is close by; Web Speech queues both safely.
    const elapsed = spokenElapsed();
    speakText(`You have been sitting for ${elapsed}.`);
  }

  function spokenClockTime(date=new Date()){
    return date.toLocaleTimeString([], {hour:"numeric",minute:"2-digit",hour12:true});
  }

  function clockAnnouncementKey(date=new Date()){
    return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}-${date.getHours()}-${date.getMinutes() < 30 ? 0 : 30}`;
  }

  function speakClockAnnouncement(date=new Date(), catchUp=false){
    if(!reminderOn || !sittingStartedAt || !settings.clockAlerts) return;
    const key = clockAnnouncementKey(date);
    if(key === lastClockAnnouncementKey && !catchUp) return;
    lastClockAnnouncementKey = key;
    lastClockSpokenAt = Date.now();
    save();
    // Keep this as one utterance so iOS cannot split the clock and sitting-time portions.
    speakText(`It is ${spokenClockTime(date)}, and you have been sitting for ${spokenElapsed()}.`, 6000);
  }

  function msUntilNextHalfHour(){
    const now = new Date();
    const next = new Date(now);
    next.setSeconds(0,0);
    if(now.getMinutes() < 30){
      next.setMinutes(30);
    }else{
      next.setHours(now.getHours()+1);
      next.setMinutes(0);
    }
    return Math.max(250, next.getTime() - now.getTime());
  }

  function scheduleClockAnnouncement(){
    clearTimeout(clockAnnouncementTimer);
    clockAnnouncementTimer = 0;
    if(!reminderOn || !settings.clockAlerts) return;
    clockAnnouncementTimer = setTimeout(()=>{
      speakClockAnnouncement(new Date());
      scheduleClockAnnouncement();
    }, msUntilNextHalfHour());
  }

  function scheduleReminder(){
    clearInterval(reminderTimer);
    reminderTimer = 0;
    if(!reminderOn) return;
    const intervalMs = REMINDER_MINUTES[settings.reminderIndex] * 60000;
    reminderTimer = setInterval(speakReminder, intervalMs);
  }

  function setReminderState(on){
    reminderOn = on;
    E.alarm.classList.toggle("active", reminderOn);
    E.alarm.setAttribute("aria-pressed", String(reminderOn));

    if(reminderOn){
      sittingStartedAt = Date.now();
      updateSittingDisplay();
      scheduleReminder();
      scheduleClockAnnouncement();
      save();
      note(`Sitting reminder on · every ${REMINDER_MINUTES[settings.reminderIndex]} minutes${settings.clockAlerts ? " · clock at :00/:30" : ""}`);
      try{
        if("speechSynthesis" in window){
          const unlock = new SpeechSynthesisUtterance("");
          applyVoice(unlock);
          speechSynthesis.speak(unlock);
        }
      }catch{}
    }else{
      clearInterval(reminderTimer);
      reminderTimer = 0;
      clearTimeout(clockAnnouncementTimer);
      clockAnnouncementTimer = 0;
      sittingStartedAt = 0;
      lastClockAnnouncementKey = "";
      save();
      updateSittingDisplay();
      try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch{}
      note("Sitting reminder off");
    }
  }

  E.alarm.addEventListener("click", ()=>setReminderState(!reminderOn));

  E.reset.addEventListener("click", ()=>{
    Object.assign(settings, DEFAULTS);
    initStars();
    syncControls();
    save();
    if(reminderOn){
      scheduleReminder();
      scheduleClockAnnouncement();
    }
    note("Controls reset");
  });

  E.hide.addEventListener("click", ()=>{
    controlsHidden = true;
    syncControls();
    save();
  });

  E.controlsButton.addEventListener("click", ()=>{
    controlsHidden = !controlsHidden;
    syncControls();
    save();
  });

  async function acquireWakeLock(){
    if(!("wakeLock" in navigator)){
      note("Screen Wake Lock is not supported in this browser.");
      return false;
    }

    try{
      wakeLock = await navigator.wakeLock.request("screen");

      wakeLock.addEventListener("release", ()=>{
        wakeLock = null;
        updatePowerState();
      });

      return true;
    }catch(error){
      wakeLock = null;
      note("Wake lock could not start: " + (error?.message || error?.name || "request rejected"));
      return false;
    }
  }

  async function requestFullscreen(){
    try{
      if(document.fullscreenElement) return;
      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen({navigationUI:"hide"});
      }
    }catch{
      /* Fullscreen is optional. Wake mode still works without it. */
    }
  }

  async function exitFullscreen(){
    try{
      if(document.fullscreenElement && document.exitFullscreen){
        await document.exitFullscreen();
      }
    }catch{}
  }

  function updatePowerState(){
    const held = !!wakeLock && !wakeLock.released;
    E.power.classList.toggle("active", wakeWanted && held);
    E.power.setAttribute("aria-pressed", String(wakeWanted && held));
  }

  E.power.addEventListener("click", async ()=>{
    if(wakeWanted){
      wakeWanted = false;

      if(wakeLock){
        try{ await wakeLock.release(); }catch{}
        wakeLock = null;
      }

      await exitFullscreen();
      updatePowerState();
      return;
    }

    wakeWanted = true;

    const [wakeOK] = await Promise.all([
      acquireWakeLock(),
      requestFullscreen()
    ]);

    if(!wakeOK){
      wakeWanted = false;
    }

    updatePowerState();
  });

  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState === "visible"){
      if(wakeWanted && !wakeLock){
        const ok = await acquireWakeLock();
        if(!ok) wakeWanted = false;
        updatePowerState();
      }

      if(reminderOn){
        updateSittingDisplay();
        scheduleReminder();
        scheduleClockAnnouncement();

        if(settings.clockAlerts){
          const now = new Date();
          const key = clockAnnouncementKey(now);
          if(key !== lastClockAnnouncementKey){
            speakClockAnnouncement(now, true);
          }
        }
      }
    }
  });

  document.addEventListener("fullscreenchange", updatePowerState);

  addEventListener("resize", resize, {passive:true});
  addEventListener("orientationchange", ()=>setTimeout(resize,180), {passive:true});

  function frame(t){
    const dt = clamp(t-last,0,50);
    last = t;
    drawStars(dt);
    requestAnimationFrame(frame);
  }

  updateClock();
  refreshVoices();
  if("speechSynthesis" in window){
    speechSynthesis.addEventListener?.("voiceschanged", refreshVoices);
    speechSynthesis.onvoiceschanged = refreshVoices;
    setTimeout(refreshVoices, 250);
    setTimeout(refreshVoices, 1000);
  }
  syncControls();
  resize();
  E.alarm.classList.toggle("active", reminderOn);
  E.alarm.setAttribute("aria-pressed", String(reminderOn));
  updateSittingDisplay();
  if(reminderOn){
    scheduleReminder();
    scheduleClockAnnouncement();
  }

  setInterval(()=>{
    updateClock();
    updateSittingDisplay();
  },1000);
  requestAnimationFrame(t=>{
    last = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
