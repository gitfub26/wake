<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWAKE">
<meta name="theme-color" content="#000010">
<title>AWAKE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

:root {
  --primary: #00ff41;
  --secondary: #008f11;
  --dim: #003b00;
  --glow: rgba(0,255,65,0.18);
  --panel: rgba(0,15,0,0.82);
  --border: rgba(0,255,65,0.28);
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  background:#000;
}

#canvas { position:fixed; top:0; left:0; width:100%; height:100%; display:block; }

#scanlines {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.045) 2px,rgba(0,0,0,0.045) 4px);
  pointer-events:none; z-index:4;
}
#vignette {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.72) 100%);
  pointer-events:none; z-index:4;
}

/* ── TOP BAR ── */
#hud {
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:env(safe-area-inset-top,14px) 20px 0;
  display:flex; flex-direction:column; align-items:center;
  pointer-events:none;
}
#title-bar {
  display:flex; align-items:center; gap:10px;
  padding:8px 18px;
  background:var(--panel); border:1px solid var(--border);
  border-radius:30px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  pointer-events:auto; margin-top:8px;
  box-shadow:0 0 20px var(--glow),inset 0 0 10px var(--glow);
  transition:all 0.6s;
}
#title-text {
  font-family:var(--font-display); font-size:12px; font-weight:900;
  letter-spacing:4px; color:var(--primary);
  text-shadow:0 0 10px var(--primary);
  animation:glitch 9s infinite;
}
@keyframes glitch {
  0%,93%,100%{clip-path:none;transform:none}
  94%{clip-path:inset(20% 0 60% 0);transform:translateX(-3px)}
  96%{clip-path:inset(55% 0 15% 0);transform:translateX(3px)}
}
.sdot {
  width:7px; height:7px; border-radius:50%;
  background:var(--primary); box-shadow:0 0 7px var(--primary);
  animation:pdot 2s ease-in-out infinite;
}
@keyframes pdot {
  0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.65)}
}

/* ── CLOCK PANEL ── */
#clock-panel {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:10; text-align:center;
  pointer-events:auto;
  transition:opacity 0.5s ease, transform 0.5s ease;
}
#clock-panel.hidden {
  opacity:0;
  transform:translate(-50%,-50%) scale(0.88);
  pointer-events:none;
}
#clock {
  font-family:var(--font-display);
  font-size:clamp(42px,14vw,92px);
  font-weight:900; color:var(--primary);
  text-shadow:0 0 24px var(--primary),0 0 50px var(--primary);
  letter-spacing:3px; line-height:1;
  transition:color 0.6s,text-shadow 0.6s;
}
#clock-ampm {
  font-family:var(--font-display);
  font-size:clamp(16px,4.5vw,30px); font-weight:700;
  color:var(--secondary); letter-spacing:4px; margin-top:4px;
  text-shadow:0 0 12px var(--primary); transition:color 0.6s;
}
#date-display {
  font-family:var(--font-mono);
  font-size:clamp(10px,3vw,14px); color:var(--secondary);
  letter-spacing:5px; margin-top:10px; text-transform:uppercase;
  transition:color 0.6s;
}
#wake-status {
  font-family:var(--font-mono); font-size:10px;
  color:var(--secondary); letter-spacing:3px;
  margin-top:14px; opacity:0.75;
}

/* Hide clock tap hint */
#clock-hint {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:10; text-align:center;
  pointer-events:none; opacity:0;
  transition:opacity 0.5s ease;
  font-family:var(--font-mono); font-size:11px;
  color:var(--secondary); letter-spacing:3px;
}
#clock-panel.hidden ~ #clock-hint { opacity:0.5; }

/* ── BOTTOM CONTROLS ── */
#controls {
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  padding:0 16px calc(env(safe-area-inset-bottom,16px) + 14px);
  display:flex; flex-direction:column; align-items:center; gap:10px;
}

/* Mode pills — 2 rows of 2, wider on iPhone */
#mode-selector {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  width:100%; max-width:360px;
}
.mode-pill {
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:1.5px;
  color:var(--secondary); background:var(--panel); border:1px solid var(--border);
  border-radius:20px; padding:8px 4px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:all 0.3s; -webkit-appearance:none; appearance:none;
  text-transform:uppercase; text-align:center;
}
.mode-pill.active {
  background:var(--primary); color:#000;
  border-color:var(--primary); box-shadow:0 0 14px var(--primary); font-weight:700;
}
.mode-pill:active { transform:scale(0.93); }

#btn-row { display:flex; gap:9px; align-items:center; }
.ctrl-btn {
  font-family:var(--font-mono); font-size:11px; letter-spacing:2px;
  color:var(--primary); background:var(--panel); border:1px solid var(--border);
  border-radius:20px; padding:10px 14px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:all 0.3s; box-shadow:0 0 10px var(--glow);
  text-transform:uppercase; white-space:nowrap;
  -webkit-appearance:none; appearance:none;
}
.ctrl-btn:active { transform:scale(0.93); box-shadow:0 0 22px var(--primary); }
.ctrl-btn.icon-btn {
  width:44px; height:44px; padding:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; font-size:17px;
}
.ctrl-btn.primary-btn {
  padding:11px 20px; font-size:11px;
  font-family:var(--font-display); font-weight:700; letter-spacing:2.5px;
}
.ctrl-btn.active { background:var(--primary); color:#000; box-shadow:0 0 18px var(--primary); }

/* Clock toggle button */
#clock-toggle-btn { font-size:15px; }

/* Color swatch strip */
#color-strip {
  display:flex; gap:7px; align-items:center; justify-content:center;
  width:100%; max-width:360px;
}
.cswatch {
  width:28px; height:28px; border-radius:50%;
  border:2px solid transparent;
  cursor:pointer; transition:all 0.3s;
  -webkit-tap-highlight-color:transparent;
  flex-shrink:0;
  box-shadow:0 0 0 0 transparent;
}
.cswatch.active {
  border-color:#fff;
  transform:scale(1.25);
  box-shadow:0 0 10px currentColor;
}
.cswatch:active { transform:scale(1.05); }

/* Slider */
#slider-row { display:flex; align-items:center; gap:10px; width:100%; max-width:340px; }
#slider-row label { font-family:var(--font-mono); font-size:10px; color:var(--secondary); letter-spacing:2px; white-space:nowrap; }
input[type=range] {
  -webkit-appearance:none; appearance:none; flex:1; height:3px;
  background:var(--dim); border-radius:2px; outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none; width:18px; height:18px;
  border-radius:50%; background:var(--primary); box-shadow:0 0 8px var(--primary); cursor:pointer;
}

/* Wake indicator */
#wake-indicator {
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:10px;
  color:var(--secondary); letter-spacing:2px; opacity:.7;
}
.wdot { width:6px; height:6px; border-radius:50%; background:var(--secondary); }
.wdot.active { background:var(--primary); box-shadow:0 0 7px var(--primary); animation:pdot 1.5s ease-in-out infinite; }

/* Toast */
#toast {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(0.85);
  background:var(--panel); border:1px solid var(--border);
  color:var(--primary); font-family:var(--font-mono);
  font-size:12px; letter-spacing:2px; padding:12px 22px; border-radius:8px;
  z-index:100; opacity:0; transition:all 0.3s ease;
  backdrop-filter:blur(12px); pointer-events:none;
  text-align:center; text-transform:uppercase; white-space:nowrap;
}
#toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

#nosleep-video { position:fixed; top:-1px; left:-1px; width:1px; height:1px; opacity:.01; pointer-events:none; z-index:-1; }
</style>
</head>

<script>
// ── PWA ──────────────────────────────────────────────────────────
const mfst={name:'AWAKE',short_name:'AWAKE',start_url:'.',display:'fullscreen',orientation:'any',background_color:'#000010',theme_color:'#00ff41',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext y='.9em' font-size='90'%3E🟩%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
const mblob=new Blob([JSON.stringify(mfst)],{type:'application/json'});
const mlink=document.createElement('link');mlink.rel='manifest';mlink.href=URL.createObjectURL(mblob);document.head.appendChild(mlink);
if('serviceWorker' in navigator){
  const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('')))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}

// ── Palettes ─────────────────────────────────────────────────────
const PALETTES = [
  {name:'Green',   hex:'#00ff41', p:'#00ff41', s:'#008f11', d:'#003b00', r:0,   g:255, b:65},
  {name:'Cyan',    hex:'#00d4ff', p:'#00d4ff', s:'#006688', d:'#001833', r:0,   g:212, b:255},
  {name:'Purple',  hex:'#bf5fff', p:'#bf5fff', s:'#7700cc', d:'#1a0033', r:191, g:95,  b:255},
  {name:'Amber',   hex:'#ffb700', p:'#ffb700', s:'#996d00', d:'#332200', r:255, g:183, b:0},
  {name:'Red',     hex:'#ff2244', p:'#ff2244', s:'#991122', d:'#330008', r:255, g:34,  b:68},
  {name:'Pink',    hex:'#ff55cc', p:'#ff55cc', s:'#bb2299', d:'#330022', r:255, g:85,  b:204},
  {name:'Teal',    hex:'#00ffcc', p:'#00ffcc', s:'#007755', d:'#002211', r:0,   g:255, b:204},
  {name:'White',   hex:'#e8e8ff', p:'#e8e8ff', s:'#9999cc', d:'#222233', r:232, g:232, b:255},
];

// ── State ────────────────────────────────────────────────────────
let vizMode='matrix', isDayMode=false, clockVisible=true;
let wakeLockActive=false, wakeLockSentinel=null;
let speed=5, animFrame, colorMode=0;

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W, H;

// ── Color helpers ────────────────────────────────────────────────
function pal(){ return PALETTES[colorMode]; }
function rgba(a){
  const c=pal();
  if(isDayMode) return`rgba(20,80,40,${a})`;
  return`rgba(${c.r},${c.g},${c.b},${a})`;
}
function applyCSS(){
  const c=pal();
  const p=isDayMode?'#1a6b2e':c.p;
  const s=isDayMode?'#2a9940':c.s;
  const d=isDayMode?'#a0ccb0':c.d;
  const g=isDayMode?'rgba(26,107,46,0.14)':`rgba(${c.r},${c.g},${c.b},0.18)`;
  const panel=isDayMode?'rgba(220,245,225,0.88)':'rgba(0,15,0,0.82)';
  const border=isDayMode?'rgba(26,107,46,0.25)':`rgba(${c.r},${c.g},${c.b},0.28)`;
  const root=document.documentElement.style;
  root.setProperty('--primary',p); root.setProperty('--secondary',s);
  root.setProperty('--dim',d);     root.setProperty('--glow',g);
  root.setProperty('--panel',panel); root.setProperty('--border',border);
  document.body.style.background=isDayMode?'#dff0e4':'#000000';
  // Update swatch active state
  document.querySelectorAll('.cswatch').forEach((sw,i)=>{
    sw.classList.toggle('active', i===colorMode);
    sw.style.boxShadow=i===colorMode?`0 0 10px ${PALETTES[i].hex}`:'none';
  });
}

function buildSwatches(){
  const strip=document.getElementById('color-strip');
  strip.innerHTML='';
  PALETTES.forEach((p,i)=>{
    const s=document.createElement('button');
    s.className='cswatch'+(i===0?' active':'');
    s.style.background=p.hex;
    s.style.color=p.hex;
    s.title=p.name;
    s.addEventListener('click',()=>{
      colorMode=i;
      applyCSS();
      ctx.clearRect(0,0,W,H);
      showToast(p.name.toUpperCase());
    });
    strip.appendChild(s);
  });
}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  initCurrentMode();
}

// ══ MATRIX ═══════════════════════════════════════════════════════
const CHARS='ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&<>{}|~';
const TRAIL_LEN = 28;  // number of visible cells in each column's tail
let mCols=[], mFS=16, mTick=0;

// Each column: { head (float row), trail (array of {ch,age}), active }
function initMatrix(){
  mFS=Math.max(12,Math.min(18,W/40));
  const n=Math.floor(W/mFS);
  mCols=Array.from({length:n},(_,i)=>({
    head: Math.random()*-40,          // start staggered above screen
    trail: [],
    speed: 0.3+Math.random()*0.55,    // per-column speed variation
    active: true,
  }));
}

function rndCh(){ return CHARS[Math.floor(Math.random()*CHARS.length)]; }

function drawMatrix(){
  // Dark background wipe — keep very transparent so old chars linger longer
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.55)':'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);

  const sf=speed/5;
  const skip=Math.max(1,Math.round(3/sf));
  mTick++;
  const doStep=(mTick%skip===0);

  ctx.font=`${mFS}px 'Share Tech Mono',monospace`;
  const c=pal();

  for(let i=0;i<mCols.length;i++){
    const col=mCols[i];
    const x=i*mFS;

    if(doStep){
      // Advance head
      col.head+=col.speed*sf;

      // Push new character at head position into trail
      const headRow=Math.floor(col.head);
      if(col.trail.length===0 || col.trail[col.trail.length-1].row !== headRow){
        col.trail.push({ ch:rndCh(), row:headRow });
        // Randomly mutate existing trail characters (flickering effect)
        if(col.trail.length>2 && Math.random()<0.18){
          const ri=Math.floor(Math.random()*(col.trail.length-1));
          col.trail[ri].ch=rndCh();
        }
      }

      // Trim trail to max length
      if(col.trail.length>TRAIL_LEN) col.trail.shift();

      // Reset column when it scrolls fully off screen
      if(col.head*mFS>H+mFS*TRAIL_LEN){
        col.head=Math.random()*-30;
        col.trail=[];
        col.speed=0.3+Math.random()*0.55;
      }
    }

    // Draw each cell in the trail with brightness based on position
    const tLen=col.trail.length;
    for(let t=0;t<tLen;t++){
      const cell=col.trail[t];
      const y=cell.row*mFS;
      if(y<-mFS||y>H+mFS) continue;

      const pos=t/tLen; // 0=oldest(tail) → 1=newest(head)
      const isHead=(t===tLen-1);

      let alpha, r2, g2, b2;
      if(isDayMode){
        // Day: head=white, trail=dark green fading
        if(isHead){ r2=255;g2=255;b2=255;alpha=0.98; }
        else { r2=20;g2=80;b2=40; alpha=0.15+pos*0.65; }
      } else {
        if(isHead){
          // Bright white-green head
          r2=200+(c.r-200>0?c.r-200:0); g2=255; b2=c.b>100?c.b:80;
          alpha=1.0;
        } else {
          // Trail: interpolate from dim to bright as pos→1
          // Oldest cells very dim, newest near-head fairly bright
          const brightness=0.08+Math.pow(pos,1.6)*0.82;
          r2=c.r; g2=c.g; b2=c.b;
          alpha=brightness;
        }
      }

      if(isHead){
        ctx.shadowColor=isDayMode?'#ffffff':c.p;
        ctx.shadowBlur=14;
      } else {
        ctx.shadowBlur=0;
      }

      ctx.fillStyle=`rgba(${r2},${g2},${b2},${alpha})`;
      ctx.fillText(cell.ch, x, y);
    }
    ctx.shadowBlur=0;
  }
}

// ══ NETWORK ══════════════════════════════════════════════════════
let particles=[];
const MAX_P=110, CONN=130;
function initParticles(){
  particles=Array.from({length:MAX_P},()=>({
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5,
    r:Math.random()*2.5+1,
    bokeh:Math.random()>.68, bokehR:Math.random()*14+5,
    bokehA:Math.random()*.22+.04, pulse:Math.random()*Math.PI*2,
  }));
}
function drawParticles(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.18)':'rgba(0,0,10,0.22)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5*.4, c=pal();
  // Horizon glow wave
  const wg=ctx.createLinearGradient(0,H*.55,0,H);
  wg.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${isDayMode?.07:.05})`);
  wg.addColorStop(1,'transparent');
  ctx.fillStyle=wg;
  ctx.beginPath(); ctx.moveTo(0,H);
  const t=Date.now()/4500;
  for(let x=0;x<=W;x+=4){
    const y=H*.63+Math.sin(x/130+t)*20+Math.sin(x/55+t*1.4)*9;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  particles.forEach(p=>{
    p.pulse+=.03;
    p.x+=p.vx*sf*5; p.y+=p.vy*sf*5;
    if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20;
  });
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<CONN){
        ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${(1-d/CONN)*.6})`;
        ctx.lineWidth=.9;
        ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.stroke();
      }
    }
  }
  particles.forEach(p=>{
    if(p.bokeh){
      const ba=p.bokehA*(0.6+0.4*Math.sin(p.pulse));
      const rg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.bokehR);
      rg.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${ba*1.8})`);
      rg.addColorStop(1,'transparent');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(p.x,p.y,p.bokehR,0,Math.PI*2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.8+0.2*Math.sin(p.pulse)),0,Math.PI*2);
    ctx.fillStyle=`rgba(${c.r},${c.g},${c.b},0.92)`;
    ctx.shadowColor=c.p; ctx.shadowBlur=7; ctx.fill(); ctx.shadowBlur=0;
  });
}

// ══ WIREFRAME ════════════════════════════════════════════════════
// Full-screen: 3 spiral systems spanning entire viewport
let wfA=0;
function initWireframe(){}
function drawWireframe(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.09)':'rgba(0,0,0,0.05)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5;
  wfA+=.0025*sf;
  const c=pal();
  const N=100;

  ctx.save();

  // ─ Swirl A: large outer ring anchored near center-left, offset to right ─
  const ax=W*.28, ay=H*.5;
  const aR1=Math.min(W,H)*.46;  // large outer
  const aR2=Math.min(W,H)*.22;  // inner focal
  const aOx=W*.28, aOy=-H*.04; // offset of inner focal
  for(let i=0;i<N;i++){
    const a1=(i/N)*Math.PI*2+wfA;
    const a2=(i/N)*Math.PI*2*.618+wfA*1.6;
    const x1=ax+Math.cos(a1)*aR1, y1=ay+Math.sin(a1)*aR1;
    const x2=ax+aOx+Math.cos(a2)*aR2, y2=ay+aOy+Math.sin(a2)*aR2;
    const al=isDayMode?.18:.26;
    ctx.strokeStyle=isDayMode?`rgba(55,35,210,${al})`:`rgba(${c.r},${c.g},${c.b},${al})`;
    ctx.lineWidth=.85;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // ─ Swirl B: counter-rotating fan on the right side ─
  const bx=W*.74, by=H*.48;
  const bR1=Math.min(W,H)*.38;
  const bR2=Math.min(W,H)*.16;
  for(let i=0;i<N;i++){
    const a1=(i/N)*Math.PI*2-wfA*.85;
    const a2=(i/N)*Math.PI*2*.382-wfA*1.3;
    const x1=bx+Math.cos(a1)*bR1, y1=by+Math.sin(a1)*bR1;
    const x2=bx+Math.cos(a2)*bR2, y2=by+Math.sin(a2)*bR2;
    const al2=isDayMode?.14:.20;
    ctx.strokeStyle=isDayMode?`rgba(75,35,215,${al2})`:`rgba(${c.r},${c.g},${c.b},${al2})`;
    ctx.lineWidth=.75;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // ─ Swirl C: small tight rose near bottom-center ─
  const cx2=W*.5, cy2=H*.82;
  const cR=Math.min(W,H)*.22;
  const M=60;
  for(let i=0;i<M;i++){
    const a1=(i/M)*Math.PI*2+wfA*2.1;
    const a2=(i/M)*Math.PI*2*1.5+wfA*1.8;
    const x1=cx2+Math.cos(a1)*cR, y1=cy2+Math.sin(a1)*cR;
    const x2=cx2+Math.cos(a2)*cR*.45, y2=cy2+Math.sin(a2)*cR*.45;
    const al3=isDayMode?.12:.18;
    ctx.strokeStyle=isDayMode?`rgba(100,20,200,${al3})`:`rgba(${c.r},${c.g},${c.b},${al3})`;
    ctx.lineWidth=.65;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  ctx.restore();
}

// ══ WAVES ════════════════════════════════════════════════════════
// Full-screen: layers spread across full height
let waveT=0;
function initWaves(){}
function drawWaves(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.16)':'rgba(0,0,0,0.10)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5;
  waveT+=.011*sf;
  const c=pal();
  const layers=8;  // more layers to fill screen

  for(let l=0;l<layers;l++){
    const t=l/layers; // 0..1
    // Spread bases across the FULL height: top 10% to bottom 85%
    const yBase=H*(.10 + t*.75);
    const amp=H*(.06 + t*.04);
    const freq=.005+l*.0025;
    const phase=waveT*(1.2-t*.5)+l*1.3;
    const alpha=isDayMode
      ? (.28-l*.025)
      : (.42-l*.04);

    ctx.save();
    // Filled body to bottom
    ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=3){
      const y=yBase
        +Math.sin(x*freq+phase)*amp
        +Math.sin(x*freq*2.2+phase*1.5)*amp*.38
        +Math.sin(x*freq*.48+phase*.65)*amp*.55;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H); ctx.closePath();
    const grad=ctx.createLinearGradient(0,yBase-amp,0,yBase+amp*2);
    grad.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${alpha})`);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad; ctx.fill();

    // Crest line
    ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${Math.min(alpha*1.6,.55)})`;
    ctx.lineWidth=l===0?1.4:.9;
    ctx.beginPath();
    for(let x=0;x<=W;x+=3){
      const y=yBase
        +Math.sin(x*freq+phase)*amp
        +Math.sin(x*freq*2.2+phase*1.5)*amp*.38
        +Math.sin(x*freq*.48+phase*.65)*amp*.55;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Subtle horizontal glow line at mid-screen
  const mg=ctx.createLinearGradient(0,0,W,0);
  mg.addColorStop(0,'transparent');
  mg.addColorStop(.5,`rgba(${c.r},${c.g},${c.b},${isDayMode?.06:.10})`);
  mg.addColorStop(1,'transparent');
  ctx.fillStyle=mg;
  ctx.fillRect(0,H*.5-1,W,2);
}

// ── Dispatch ─────────────────────────────────────────────────────
function initCurrentMode(){
  ctx.clearRect(0,0,W,H);
  if(vizMode==='matrix') initMatrix();
  else if(vizMode==='particles') initParticles();
  else if(vizMode==='wireframe') initWireframe();
  else if(vizMode==='waves') initWaves();
}
function drawFrame(){
  if(vizMode==='matrix') drawMatrix();
  else if(vizMode==='particles') drawParticles();
  else if(vizMode==='wireframe') drawWireframe();
  else if(vizMode==='waves') drawWaves();
  animFrame=requestAnimationFrame(drawFrame);
}

// ── Clock (12hr) ─────────────────────────────────────────────────
function updateClock(){
  const now=new Date();
  let h=now.getHours();
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  const ampm=h>=12?'PM':'AM';
  h=h%12||12;
  document.getElementById('clock').textContent=`${h}:${m}:${s}`;
  document.getElementById('clock-ampm').textContent=ampm;
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('date-display').textContent=
    `${days[now.getDay()]}  ${String(now.getDate()).padStart(2,'0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(updateClock,1000); updateClock();

// ── Clock toggle ─────────────────────────────────────────────────
function toggleClock(){
  clockVisible=!clockVisible;
  document.getElementById('clock-panel').classList.toggle('hidden',!clockVisible);
  document.getElementById('clock-toggle-btn').textContent=clockVisible?'🕐':'🕐';
  document.getElementById('clock-toggle-btn').style.opacity=clockVisible?'1':'0.5';
  showToast(clockVisible?'CLOCK ON':'CLOCK HIDDEN');
}

// Tap centre of screen to toggle clock back on when hidden
canvas.addEventListener('click', e=>{
  if(!clockVisible){
    const cx=e.clientX, cy=e.clientY;
    if(cx>W*.25&&cx<W*.75&&cy>H*.25&&cy<H*.75) toggleClock();
  }
});

// ── Wake Lock ────────────────────────────────────────────────────
async function requestWakeLock(){
  if('wakeLock' in navigator){
    try{
      wakeLockSentinel=await navigator.wakeLock.request('screen');
      wakeLockActive=true;
      wakeLockSentinel.addEventListener('release',()=>{wakeLockActive=false;updateWakeUI();});
      updateWakeUI(); return true;
    }catch(e){ wakeLockActive=false; updateWakeUI(); return false; }
  }
  return false;
}
function releaseWakeLock(){
  if(wakeLockSentinel){ wakeLockSentinel.release(); wakeLockSentinel=null; }
  wakeLockActive=false; updateWakeUI();
}
function updateWakeUI(){
  const dot=document.getElementById('wake-dot');
  const label=document.getElementById('wake-label');
  const btn=document.getElementById('wake-btn');
  const status=document.getElementById('wake-status');
  if(wakeLockActive){
    dot.classList.add('active'); label.textContent='SCREEN LOCK DISABLED';
    btn.classList.add('active'); btn.textContent='■ AWAKE';
    status.textContent='WAKE LOCK: ACTIVE';
  } else {
    dot.classList.remove('active'); label.textContent='SCREEN LOCK ENABLED';
    btn.classList.remove('active'); btn.textContent='▶ AWAKE';
    status.textContent='WAKE LOCK: INACTIVE';
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&wakeLockActive) requestWakeLock();
});
function iosWake(){ document.getElementById('nosleep-video').play().catch(()=>{}); }

// ── Controls ─────────────────────────────────────────────────────
document.getElementById('wake-btn').addEventListener('click',async()=>{
  if(wakeLockActive){ releaseWakeLock(); showToast('SCREEN LOCK ENABLED'); }
  else {
    const ok=await requestWakeLock(); iosWake();
    if(!ok){ wakeLockActive=true; updateWakeUI(); }
    showToast('SCREEN WILL STAY ON');
  }
});

document.getElementById('daynight-btn').addEventListener('click',()=>{
  isDayMode=!isDayMode;
  document.getElementById('daynight-btn').textContent=isDayMode?'🌙':'☀️';
  applyCSS(); ctx.clearRect(0,0,W,H);
  showToast(isDayMode?'DAY MODE':'NIGHT MODE');
});

document.getElementById('clock-toggle-btn').addEventListener('click', toggleClock);

document.querySelectorAll('.mode-pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    vizMode=btn.dataset.mode;
    cancelAnimationFrame(animFrame);
    initCurrentMode(); drawFrame();
    showToast(btn.textContent+' MODE');
  });
});

document.getElementById('speed-slider').addEventListener('input',e=>{ speed=parseInt(e.target.value); });

// ── Toast ─────────────────────────────────────────────────────────
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{ cancelAnimationFrame(animFrame); resize(); drawFrame(); });
buildSwatches();
applyCSS();
resize();
drawFrame();

(async()=>{
  const ok=await requestWakeLock(); iosWake();
  if(!ok){ wakeLockActive=true; updateWakeUI(); }
  showToast('SYSTEM ONLINE');
})();

setInterval(()=>{
  if(document.visibilityState==='visible'){
    const v=document.getElementById('nosleep-video');
    if(v.paused) v.play().catch(()=>{});
  }
},15000);

document.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
</script>
