<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWAKE">

<title>AWAKE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

:root {
  --primary: #00ff41;
  --secondary: #008f11;
  --dim: #003b00;
  --glow: rgba(0,255,65,0.18);
  --panel: rgba(0,15,0,0.82);
  --border: rgba(0,255,65,0.28);
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; background:#000; }

#canvas { position:fixed; top:0; left:0; width:100%; height:100%; display:block; }

#scanlines {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px);
  pointer-events:none; z-index:4;
}
#vignette {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.75) 100%);
  pointer-events:none; z-index:4;
}

#hud {
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:env(safe-area-inset-top,14px) 20px 0;
  display:flex; flex-direction:column; align-items:center;
  pointer-events:none;
}
#title-bar {
  display:flex; align-items:center; gap:10px;
  padding:8px 18px;
  background:var(--panel); border:1px solid var(--border);
  border-radius:30px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  pointer-events:auto; margin-top:8px;
  box-shadow:0 0 20px var(--glow),inset 0 0 10px var(--glow);
  transition:all 0.6s;
}
#title-text {
  font-family:var(--font-display); font-size:12px; font-weight:900;
  letter-spacing:4px; color:var(--primary);
  text-shadow:0 0 10px var(--primary);
  animation:glitch 9s infinite;
}
@keyframes glitch {
  0%,93%,100%{clip-path:none;transform:none}
  94%{clip-path:inset(20% 0 60% 0);transform:translateX(-3px)}
  96%{clip-path:inset(55% 0 15% 0);transform:translateX(3px)}
}
.sdot {
  width:7px;height:7px;border-radius:50%;
  background:var(--primary);box-shadow:0 0 7px var(--primary);
  animation:pdot 2s ease-in-out infinite;
}
@keyframes pdot {
  0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}
}

#clock-panel {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:10; text-align:center; pointer-events:none;
}
#clock {
  font-family:var(--font-display);
  font-size:clamp(42px,14vw,88px);
  font-weight:900; color:var(--primary);
  text-shadow:0 0 24px var(--primary),0 0 50px var(--primary);
  letter-spacing:3px; line-height:1;
  transition:color 0.6s,text-shadow 0.6s;
}
#clock-ampm {
  font-family:var(--font-display);
  font-size:clamp(16px,4vw,28px); font-weight:700;
  color:var(--secondary); letter-spacing:4px; margin-top:4px;
  text-shadow:0 0 12px var(--primary); transition:color 0.6s;
}
#date-display {
  font-family:var(--font-mono);
  font-size:clamp(10px,3vw,14px); color:var(--secondary);
  letter-spacing:5px; margin-top:10px; text-transform:uppercase;
  transition:color 0.6s;
}
#wake-status {
  font-family:var(--font-mono); font-size:10px;
  color:var(--secondary); letter-spacing:3px;
  margin-top:14px; opacity:0.75;
}

#controls {
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  padding:0 16px calc(env(safe-area-inset-bottom,16px) + 16px);
  display:flex; flex-direction:column; align-items:center; gap:11px;
}
#mode-selector { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.mode-pill {
  font-family:var(--font-mono); font-size:10px; letter-spacing:2px;
  color:var(--secondary); background:var(--panel); border:1px solid var(--border);
  border-radius:20px; padding:7px 13px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:all 0.3s; -webkit-appearance:none; appearance:none;
  text-transform:uppercase;
}
.mode-pill.active {
  background:var(--primary); color:#000;
  border-color:var(--primary); box-shadow:0 0 14px var(--primary); font-weight:700;
}
.mode-pill:active { transform:scale(0.94); }

#btn-row { display:flex; gap:10px; align-items:center; }
.ctrl-btn {
  font-family:var(--font-mono); font-size:11px; letter-spacing:2px;
  color:var(--primary); background:var(--panel); border:1px solid var(--border);
  border-radius:20px; padding:10px 16px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:all 0.3s; box-shadow:0 0 10px var(--glow);
  text-transform:uppercase; white-space:nowrap;
  -webkit-appearance:none; appearance:none;
}
.ctrl-btn:active { transform:scale(0.94); box-shadow:0 0 22px var(--primary); }
.ctrl-btn.icon-btn {
  width:44px;height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:18px;
}
.ctrl-btn.primary-btn {
  padding:11px 24px;font-size:11px;
  font-family:var(--font-display);font-weight:700;letter-spacing:3px;
}
.ctrl-btn.active { background:var(--primary);color:#000;box-shadow:0 0 18px var(--primary); }

#slider-row { display:flex;align-items:center;gap:10px;width:100%;max-width:320px; }
#slider-row label { font-family:var(--font-mono);font-size:10px;color:var(--secondary);letter-spacing:2px;white-space:nowrap; }
input[type=range] {
  -webkit-appearance:none;appearance:none;flex:1;height:3px;
  background:var(--dim);border-radius:2px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary);cursor:pointer;
}

#wake-indicator {
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:10px;
  color:var(--secondary);letter-spacing:2px;opacity:.7;
}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--secondary);}
.wdot.active{background:var(--primary);box-shadow:0 0 7px var(--primary);animation:pdot 1.5s ease-in-out infinite;}

#toast {
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.85);
  background:var(--panel);border:1px solid var(--border);
  color:var(--primary);font-family:var(--font-mono);
  font-size:12px;letter-spacing:2px;padding:12px 22px;border-radius:8px;
  z-index:100;opacity:0;transition:all 0.3s ease;
  backdrop-filter:blur(12px);pointer-events:none;
  text-align:center;text-transform:uppercase;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

#nosleep-video{position:fixed;top:-1px;left:-1px;width:1px;height:1px;opacity:.01;pointer-events:none;z-index:-1;}
</style>
</head>

<script>
// ── PWA ─────────────────────────────────────────────────────────
const mfst={name:'AWAKE',short_name:'AWAKE',start_url:'.',display:'fullscreen',orientation:'any',background_color:'#000010',theme_color:'#00ff41',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext y='.9em' font-size='90'%3E🟩%3C/text%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
const mblob=new Blob([JSON.stringify(mfst)],{type:'application/json'});
const mlink=document.createElement('link');mlink.rel='manifest';mlink.href=URL.createObjectURL(mblob);document.head.appendChild(mlink);
if('serviceWorker' in navigator){
  const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('')))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}

// ── State ────────────────────────────────────────────────────────
let vizMode='matrix', isDayMode=false;
let wakeLockActive=false, wakeLockSentinel=null;
let speed=5, animFrame, colorMode=0;

const PALETTES=[
  {name:'🟢',p:'#00ff41',s:'#008f11',d:'#003b00',r:0,  g:255,b:65},
  {name:'🔵',p:'#00d4ff',s:'#006688',d:'#001833',r:0,  g:212,b:255},
  {name:'🟣',p:'#bf5fff',s:'#7700cc',d:'#1a0033',r:191,g:95, b:255},
  {name:'🟡',p:'#ffb700',s:'#996d00',d:'#332200',r:255,g:183,b:0},
];

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H;

function pal(){return PALETTES[colorMode];}
function rgba(a){
  const c=pal();
  if(isDayMode)return`rgba(20,80,40,${a})`;
  return`rgba(${c.r},${c.g},${c.b},${a})`;
}
function applyCSS(){
  const c=pal();
  const p=isDayMode?'#1a6b2e':c.p;
  const s=isDayMode?'#2a9940':c.s;
  const d=isDayMode?'#a0ccb0':c.d;
  const g=isDayMode?'rgba(26,107,46,0.14)':`rgba(${c.r},${c.g},${c.b},0.18)`;
  const panel=isDayMode?'rgba(220,245,225,0.88)':'rgba(0,15,0,0.82)';
  const border=isDayMode?'rgba(26,107,46,0.25)':`rgba(${c.r},${c.g},${c.b},0.28)`;
  const root=document.documentElement.style;
  root.setProperty('--primary',p);root.setProperty('--secondary',s);
  root.setProperty('--dim',d);root.setProperty('--glow',g);
  root.setProperty('--panel',panel);root.setProperty('--border',border);
  document.body.style.background=isDayMode?'#dff0e4':'#000000';
}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  initCurrentMode();
}

// ══ MATRIX ══════════════════════════════════════════════════════
const CHARS='ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&<>{}|~';
let mDrops=[],mFS=16,mTick=0;

function initMatrix(){
  mFS=Math.max(12,Math.min(18,W/40));
  const n=Math.floor(W/mFS);
  mDrops=Array(n).fill(0).map(()=>Math.random()*-120);
}

function drawMatrix(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.10)':'rgba(0,0,0,0.06)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5;
  const skip=Math.max(1,Math.round(3/sf));
  mTick++;
  if(mTick%skip===0){
    ctx.font=`${mFS}px 'Share Tech Mono',monospace`;
    for(let i=0;i<mDrops.length;i++){
      const ch=CHARS[Math.floor(Math.random()*CHARS.length)];
      const x=i*mFS,y=mDrops[i]*mFS;
      const isHead=Math.random()>0.85;
      ctx.fillStyle=isHead?(isDayMode?'rgba(255,255,255,0.97)':rgba(1)):rgba(0.82);
      ctx.shadowColor=isHead?pal().p:'transparent';
      ctx.shadowBlur=isHead?10:0;
      ctx.fillText(ch,x,y);
      ctx.shadowBlur=0;
      if(y>H&&Math.random()>0.975)mDrops[i]=0;
      mDrops[i]+=sf*0.5;
    }
  }
}

// ══ NETWORK (inspired by image 1) ═══════════════════════════════
let particles=[];
const MAX_P=110,CONN=130;

function initParticles(){
  particles=Array.from({length:MAX_P},()=>({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,
    r:Math.random()*2.5+1,
    bokeh:Math.random()>.68,bokehR:Math.random()*14+5,
    bokehA:Math.random()*.22+.04,pulse:Math.random()*Math.PI*2,
  }));
}

function drawParticles(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.18)':'rgba(0,0,10,0.22)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5*.4;
  const c=pal();

  // Horizon wave glow (like the misty wave in image 1)
  const wg=ctx.createLinearGradient(0,H*.55,0,H);
  wg.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${isDayMode?.07:.05})`);
  wg.addColorStop(1,'transparent');
  ctx.fillStyle=wg;
  ctx.beginPath();ctx.moveTo(0,H);
  const t=Date.now()/4500;
  for(let x=0;x<=W;x+=4){
    const y=H*.63+Math.sin(x/130+t)*20+Math.sin(x/55+t*1.4)*9;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  // Update
  particles.forEach(p=>{
    p.pulse+=.03;
    p.x+=p.vx*sf*5;p.y+=p.vy*sf*5;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
  });

  // Lines
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<CONN){
        const a=(1-d/CONN)*.6;
        ctx.strokeStyle=isDayMode?`rgba(30,100,60,${a})`:`rgba(${c.r},${c.g},${c.b},${a})`;
        ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();
      }
    }
  }

  // Bokeh + dots
  particles.forEach(p=>{
    if(p.bokeh){
      const ba=p.bokehA*(0.6+0.4*Math.sin(p.pulse));
      const rg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.bokehR);
      rg.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${ba*1.8})`);
      rg.addColorStop(1,'transparent');
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.arc(p.x,p.y,p.bokehR,0,Math.PI*2);ctx.fill();
    }
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(0.8+0.2*Math.sin(p.pulse)),0,Math.PI*2);
    ctx.fillStyle=`rgba(${c.r},${c.g},${c.b},0.92)`;
    ctx.shadowColor=c.p;ctx.shadowBlur=7;
    ctx.fill();ctx.shadowBlur=0;
  });
}

// ══ WIREFRAME / STRING ART (inspired by image 2) ════════════════
let wfA=0;
function initWireframe(){}
function drawWireframe(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.10)':'rgba(0,0,0,0.06)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5;
  wfA+=.003*sf;
  const c=pal();
  const N=88;

  // Swirl 1 — left anchor (like the left focal point in image 2)
  const c1x=W*.3,c1y=H*.52;
  const R1=Math.min(W,H)*.40;
  const R2=Math.min(W,H)*.26;
  ctx.save();
  for(let i=0;i<N;i++){
    const a1=(i/N)*Math.PI*2+wfA;
    const a2=(i/N)*Math.PI*2*.618+wfA*1.5;
    const x1=c1x+Math.cos(a1)*R1,y1=c1y+Math.sin(a1)*R1;
    const x2=c1x+W*.26+Math.cos(a2)*R2,y2=c1y-H*.04+Math.sin(a2)*R2;
    const alph=isDayMode?.20:.28;
    ctx.strokeStyle=isDayMode?`rgba(60,40,200,${alph})`:`rgba(${c.r},${c.g},${c.b},${alph})`;
    ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }

  // Swirl 2 — right arc fan (like the right half of image 2)
  const c2x=W*.72,c2y=H*.46;
  const R3=Math.min(W,H)*.32;
  for(let i=0;i<N;i++){
    const a1=(i/N)*Math.PI*2-wfA*.9;
    const a2=(i/N)*Math.PI*2*.382-wfA*1.2;
    const x1=c2x+Math.cos(a1)*R3,y1=c2y+Math.sin(a1)*R3;
    const x2=c2x+Math.cos(a2)*R3*.55,y2=c2y+Math.sin(a2)*R3*.55;
    const alph2=isDayMode?.15:.20;
    ctx.strokeStyle=isDayMode?`rgba(80,40,210,${alph2})`:`rgba(${c.r},${c.g},${c.b},${alph2})`;
    ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  ctx.restore();
}

// ══ WAVES (aurora layers) ════════════════════════════════════════
let waveT=0;
function initWaves(){}
function drawWaves(){
  ctx.fillStyle=isDayMode?'rgba(215,240,220,0.20)':'rgba(0,0,0,0.12)';
  ctx.fillRect(0,0,W,H);
  const sf=speed/5;
  waveT+=.012*sf;
  const c=pal();
  const layers=6;
  for(let l=0;l<layers;l++){
    const freq=.006+l*.003;
    const amp=H*.07+l*H*.025;
    const yBase=H*(.3+l*.07);
    const phase=waveT*(1+l*.3)+l*1.1;
    const alpha=isDayMode?(.22-l*.025):(.35-l*.04);
    ctx.save();
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=3){
      const y=yBase+Math.sin(x*freq+phase)*amp+Math.sin(x*freq*2.1+phase*1.4)*amp*.4+Math.sin(x*freq*.5+phase*.7)*amp*.6;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.closePath();
    const grad=ctx.createLinearGradient(0,yBase-amp,0,yBase+amp);
    grad.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${alpha})`);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${alpha*1.5})`;
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=W;x+=3){
      const y=yBase+Math.sin(x*freq+phase)*amp+Math.sin(x*freq*2.1+phase*1.4)*amp*.4+Math.sin(x*freq*.5+phase*.7)*amp*.6;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

// ── Dispatch ─────────────────────────────────────────────────────
function initCurrentMode(){
  ctx.clearRect(0,0,W,H);
  if(vizMode==='matrix')initMatrix();
  else if(vizMode==='particles')initParticles();
  else if(vizMode==='wireframe')initWireframe();
  else if(vizMode==='waves')initWaves();
}
function drawFrame(){
  if(vizMode==='matrix')drawMatrix();
  else if(vizMode==='particles')drawParticles();
  else if(vizMode==='wireframe')drawWireframe();
  else if(vizMode==='waves')drawWaves();
  animFrame=requestAnimationFrame(drawFrame);
}

// ── Clock (12hr) ─────────────────────────────────────────────────
function updateClock(){
  const now=new Date();
  let h=now.getHours();
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  const ampm=h>=12?'PM':'AM';
  h=h%12||12;
  document.getElementById('clock').textContent=`${h}:${m}:${s}`;
  document.getElementById('clock-ampm').textContent=ampm;
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('date-display').textContent=
    `${days[now.getDay()]}  ${String(now.getDate()).padStart(2,'0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(updateClock,1000);updateClock();

// ── Wake Lock ────────────────────────────────────────────────────
async function requestWakeLock(){
  if('wakeLock' in navigator){
    try{
      wakeLockSentinel=await navigator.wakeLock.request('screen');
      wakeLockActive=true;
      wakeLockSentinel.addEventListener('release',()=>{wakeLockActive=false;updateWakeUI();});
      updateWakeUI();return true;
    }catch(e){wakeLockActive=false;updateWakeUI();return false;}
  }
  return false;
}
function releaseWakeLock(){
  if(wakeLockSentinel){wakeLockSentinel.release();wakeLockSentinel=null;}
  wakeLockActive=false;updateWakeUI();
}
function updateWakeUI(){
  const dot=document.getElementById('wake-dot');
  const label=document.getElementById('wake-label');
  const btn=document.getElementById('wake-btn');
  const status=document.getElementById('wake-status');
  if(wakeLockActive){
    dot.classList.add('active');label.textContent='SCREEN LOCK DISABLED';
    btn.classList.add('active');btn.textContent='■ KEEP AWAKE';
    status.textContent='WAKE LOCK: ACTIVE';
  }else{
    dot.classList.remove('active');label.textContent='SCREEN LOCK ENABLED';
    btn.classList.remove('active');btn.textContent='▶ KEEP AWAKE';
    status.textContent='WAKE LOCK: INACTIVE';
  }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&wakeLockActive)requestWakeLock();
});
function iosWake(){document.getElementById('nosleep-video').play().catch(()=>{});}

// ── Controls ─────────────────────────────────────────────────────
document.getElementById('wake-btn').addEventListener('click',async()=>{
  if(wakeLockActive){releaseWakeLock();showToast('SCREEN LOCK ENABLED');}
  else{const ok=await requestWakeLock();iosWake();if(!ok){wakeLockActive=true;updateWakeUI();}showToast('SCREEN WILL STAY ON');}
});

document.getElementById('daynight-btn').addEventListener('click',()=>{
  isDayMode=!isDayMode;
  document.getElementById('daynight-btn').textContent=isDayMode?'🌙':'☀️';
  applyCSS();ctx.clearRect(0,0,W,H);
  showToast(isDayMode?'DAY MODE':'NIGHT MODE');
});

document.getElementById('color-btn').addEventListener('click',()=>{
  colorMode=(colorMode+1)%PALETTES.length;
  document.getElementById('color-btn').textContent=PALETTES[colorMode].name;
  applyCSS();ctx.clearRect(0,0,W,H);
  showToast(['GREEN','CYAN','PURPLE','AMBER'][colorMode]);
});

document.querySelectorAll('.mode-pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    vizMode=btn.dataset.mode;
    cancelAnimationFrame(animFrame);
    initCurrentMode();drawFrame();
    showToast(btn.textContent+' MODE');
  });
});

document.getElementById('speed-slider').addEventListener('input',e=>{speed=parseInt(e.target.value);});

// ── Toast ─────────────────────────────────────────────────────────
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

// ── Boot ─────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{cancelAnimationFrame(animFrame);resize();drawFrame();});
applyCSS();resize();drawFrame();

(async()=>{
  const ok=await requestWakeLock();iosWake();
  if(!ok){wakeLockActive=true;updateWakeUI();}
  showToast('SYSTEM ONLINE');
})();

setInterval(()=>{
  if(document.visibilityState==='visible'){const v=document.getElementById('nosleep-video');if(v.paused)v.play().catch(()=>{});}
},15000);

document.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
</script>
