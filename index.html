<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Kinetic Wake Lock PWA</title>
    <script>
        const manifest = {
            "name": "Kinetic Wake Lock PWA",
            "short_name": "Kinetic",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#000000",
            "icons": [{
                "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%235c5c5c'/%3E%3C/svg%3E",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.write(`<link rel="manifest" href="${manifestUrl}">`);
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            background: rgba(128, 128, 128, 0.15);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            width: fit-content;
            min-width: 300px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .controls-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .lock-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #lock-status {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
        }
        
        button.action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.3s ease;
            color: #ffffff;
        }

        button.action-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.8);
        }

        button#panel-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease, transform 0.3s ease;
            line-height: 1;
            color: #ffffff;
        }

        #expanded-controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 250px; 
            opacity: 1;
            margin-top: 15px;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.3s ease, 
                        margin-top 0.4s ease;
        }

        #expanded-controls-container.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 5px;
            align-items: center;
        }

        .slider-container label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 90%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: currentColor;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(128, 128, 128, 0.5);
            border-radius: 2px;
        }

        .color-picker-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .color-node {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .color-node:hover {
            transform: scale(1.2);
        }

        #node-black { background-color: #000000; }
        #node-gray { background-color: #5c5c5c; }
        #node-white { background-color: #ffffff; }
        #node-orange { background-color: #F49D00; }
        #node-pink { background-color: #FF00FF; }
        #node-purple { background-color: #9933FF; }
        #node-blue { background-color: #00CCFF; }
        #node-teal { background-color: #00CCCC; }
        #node-lime { background-color: #80CC00; }

        @media (max-width: 600px) {
            .color-picker-group { gap: 10px; }
            .color-node { width: 22px; height: 22px; }
            #ui-layer { min-width: 260px; padding: 12px 20px; }
        }
    </style>
</head>
<body>
    <canvas id="generative-surface"></canvas>
    
    <div id="ui-layer">
        <div class="controls-header">
            <div class="lock-group">
                <button id="toggle-lock" class="action-btn">Terminate Lock</button>
                <div id="lock-status">INITIALIZING</div>
            </div>
            <button id="panel-toggle" onclick="togglePalette()">+</button>
        </div>

        <div id="expanded-controls-container" class="collapsed">
            <div class="control-row">
                <button id="btn-wireframe" class="action-btn" onclick="setEngineMode('wireframe')">Wireframe</button>
                <button id="btn-matrix" class="action-btn active" onclick="setEngineMode('matrix')">Matrix</button>
            </div>

            <div class="control-row slider-container">
                <label id="speed-label">Velocity Constraint: <span id="speed-readout">25%</span></label>
                <input type="range" id="speed-slider" min="1" max="100" step="1" value="25" oninput="updateSpeedMultiplier(this.value)">
            </div>

            <div class="color-picker-group">
                <div class="color-node" id="node-black" onclick="updateTheme('#000000', this)"></div>
                <div class="color-node" id="node-gray" onclick="updateTheme('#5c5c5c', this)"></div>
                <div class="color-node" id="node-white" onclick="updateTheme('#ffffff', this)"></div>
            </div>
            
            <div class="color-picker-group">
                <div class="color-node" id="node-orange" onclick="updateTheme('#F49D00', this)"></div>
                <div class="color-node" id="node-pink" onclick="updateTheme('#FF00FF', this)"></div>
                <div class="color-node" id="node-purple" onclick="updateTheme('#9933FF', this)"></div>
                <div class="color-node" id="node-blue" onclick="updateTheme('#00CCFF', this)"></div>
                <div class="color-node" id="node-teal" onclick="updateTheme('#00CCCC', this)"></div>
                <div class="color-node" id="node-lime" onclick="updateTheme('#80CC00', this)"></div>
            </div>
        </div>
    </div>

    <script>
        /* --- State & API Integrations --- */
        let wakeLockRef = null;
        let activeEngine = 'matrix';
        let speedMultiplier = 0.75; // Pre-calculated 25% of the 3.0 maximum
        let contrastMode = 'dark'; 
        let currentRgb = { r: 0, g: 0, b: 0 };
        let isPaletteOpen = false; // Initialized strictly closed

        const canvas = document.getElementById('generative-surface');
        const ctx = canvas.getContext('2d');

        /* --- Wake Lock Management --- */
        const statusDisplay = document.getElementById('lock-status');
        const actionBtn = document.getElementById('toggle-lock');

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) {
                statusDisplay.textContent = 'UNSUPPORTED';
                actionBtn.style.display = 'none';
                return;
            }
            try {
                wakeLockRef = await navigator.wakeLock.request('screen');
                statusDisplay.textContent = 'ACTIVE';
                actionBtn.textContent = 'Terminate Lock';
                wakeLockRef.addEventListener('release', () => {
                    statusDisplay.textContent = 'INACTIVE';
                    actionBtn.textContent = 'Initialize Lock';
                    wakeLockRef = null;
                });
            } catch (err) {
                statusDisplay.textContent = 'REJECTED';
                actionBtn.textContent = 'Initialize Lock';
                console.warn(`Initial automated lock request rejected by browser heuristics: ${err.message}`);
            }
        }

        actionBtn.addEventListener('click', () => wakeLockRef !== null ? wakeLockRef.release() : acquireWakeLock());
        document.addEventListener('visibilitychange', async () => {
            if (wakeLockRef !== null && document.visibilityState === 'visible') await acquireWakeLock();
        });

        /* --- UI Management --- */
        function togglePalette() {
            const container = document.getElementById('expanded-controls-container');
            const toggleBtn = document.getElementById('panel-toggle');
            isPaletteOpen = !isPaletteOpen;
            if (isPaletteOpen) {
                container.classList.remove('collapsed');
                toggleBtn.textContent = '-';
            } else {
                container.classList.add('collapsed');
                toggleBtn.textContent = '+';
            }
        }

        function updateSpeedMultiplier(percentageVal) {
            document.getElementById('speed-readout').textContent = `${percentageVal}%`;
            // Normalizing 1-100 to a 0.03 - 3.0 scalar coefficient
            speedMultiplier = (parseInt(percentageVal) / 100) * 3.0;
        }

        function setEngineMode(mode) {
            activeEngine = mode;
            document.getElementById('btn-wireframe').classList.toggle('active', mode === 'wireframe');
            document.getElementById('btn-matrix').classList.toggle('active', mode === 'matrix');
            
            ctx.fillStyle = `rgb(${currentRgb.r}, ${currentRgb.g}, ${currentRgb.b})`;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            if (mode === 'matrix') initMatrix();
        }

        /* --- Shared Utilities --- */
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
            return {
                r: parseInt(hex.substring(0, 2), 16),
                g: parseInt(hex.substring(2, 4), 16),
                b: parseInt(hex.substring(4, 6), 16)
            };
        }

        function calculateContrastMode(r, g, b) {
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? 'dark' : 'light';
        }

        function syncCanvasDimensions() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            
            initMatrix();
            initWireframe();
            
            ctx.fillStyle = `rgb(${currentRgb.r}, ${currentRgb.g}, ${currentRgb.b})`;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', syncCanvasDimensions);

        /* --- Wireframe Engine --- */
        let entities = [];
        class KineticEntity {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.vx = (Math.random() - 0.5) * 1.6;
                this.vy = (Math.random() - 0.5) * 1.6;
                this.mass = Math.random() * 2 + 0.5;
            }
            computePhysics() {
                this.x += this.vx * speedMultiplier;
                this.y += this.vy * speedMultiplier;
                if (this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
                if (this.y < 0 || this.y > window.innerHeight) this.vy *= -1;
            }
            render(context, entityColor) {
                context.beginPath();
                context.arc(this.x, this.y, this.mass, 0, Math.PI * 2);
                context.fillStyle = entityColor;
                context.fill();
            }
        }

        function initWireframe() {
            entities = [];
            const entityCount = window.innerWidth < 600 ? 50 : 100;
            for (let i = 0; i < entityCount; i++) entities.push(new KineticEntity());
        }

        function renderWireframeFrame() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            
            const isDarkMesh = contrastMode === 'dark';
            const nodeColor = isDarkMesh ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)';

            entities.forEach(entity => {
                entity.computePhysics();
                entity.render(ctx, nodeColor);
            });

            const connectionDistance = 140;
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    const dx = entities[i].x - entities[j].x;
                    const dy = entities[i].y - entities[j].y;
                    const squaredDistance = dx * dx + dy * dy;

                    if (squaredDistance < connectionDistance * connectionDistance) {
                        const distance = Math.sqrt(squaredDistance);
                        const opacity = 1 - (distance / connectionDistance);
                        
                        ctx.beginPath();
                        ctx.strokeStyle = isDarkMesh 
                            ? `rgba(0,0,0,${opacity * 0.5})` 
                            : `rgba(255,255,255,${opacity * 0.5})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(entities[i].x, entities[i].y);
                        ctx.lineTo(entities[j].x, entities[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        /* --- Matrix Engine --- */
        const charset = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const fontSize = 16;
        let drops = [];

        function initMatrix() {
            const columns = Math.floor(window.innerWidth / fontSize) + 1;
            drops = [];
            for (let x = 0; x < columns; x++) drops[x] = (Math.random() * -100);
        }

        function renderMatrixFrame() {
            ctx.fillStyle = `rgba(${currentRgb.r}, ${currentRgb.g}, ${currentRgb.b}, 0.08)`;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            ctx.fillStyle = contrastMode === 'dark' ? '#000000' : '#ffffff';
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                if (drops[i] * fontSize >= 0) {
                    const text = charset[Math.floor(Math.random() * charset.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                }
                
                if (drops[i] * fontSize > window.innerHeight && Math.random() > 0.975) drops[i] = 0;
                
                drops[i] += (0.8 * speedMultiplier); 
            }
        }

        /* --- Multiplexed Rendering Loop --- */
        function renderLoop() {
            if (activeEngine === 'wireframe') {
                renderWireframeFrame();
            } else {
                renderMatrixFrame();
            }
            requestAnimationFrame(renderLoop);
        }

        /* --- Theme Management --- */
        window.updateTheme = function(hexColor, pickerNode) {
            currentRgb = hexToRgb(hexColor);
            contrastMode = calculateContrastMode(currentRgb.r, currentRgb.g, currentRgb.b);
            
            document.body.style.backgroundColor = hexColor;
            
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if(metaTheme) metaTheme.setAttribute('content', hexColor);

            const isDarkText = contrastMode === 'dark';
            const uiColor = isDarkText ? '#000000' : '#ffffff';
            const uiBorder = isDarkText ? 'rgba(0, 0, 0, 0.4)' : 'rgba(255, 255, 255, 0.4)';
            
            document.getElementById('lock-status').style.color = uiColor;
            document.getElementById('speed-label').style.color = uiColor;
            document.getElementById('speed-slider').style.color = uiColor; 

            document.querySelectorAll('.action-btn, #panel-toggle').forEach(btn => {
                btn.style.color = uiColor;
                btn.style.borderColor = uiBorder;
            });
            
            document.querySelectorAll('.color-node').forEach(node => {
                node.style.borderColor = uiBorder;
                node.style.boxShadow = 'none';
            });
            
            if (pickerNode) {
                pickerNode.style.borderColor = uiColor;
                pickerNode.style.boxShadow = `0 0 10px ${isDarkText ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)'}`;
            }

            ctx.fillStyle = hexColor;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        };

        /* --- Bootstrap Sequence --- */
        window.addEventListener('load', () => {
            initWireframe();
            syncCanvasDimensions();
            updateTheme('#000000', document.getElementById('node-black'));
            
            // Aggressive automated lock acquisition
            acquireWakeLock();
            
            // Initialize rendering pipeline
            requestAnimationFrame(renderLoop);
        });

        /* --- Offline Service Worker --- */
        const serviceWorkerLogic = `
            self.addEventListener('install', event => self.skipWaiting());
            self.addEventListener('activate', event => event.waitUntil(clients.claim()));
            self.addEventListener('fetch', event => {
                event.respondWith(
                    fetch(event.request).catch(() => new Response('Offline Mode Active'))
                );
            });
        `;
        const swBlob = new Blob([serviceWorkerLogic], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: '/' })
                .catch(err => console.error('SW Error:', err));
            });
        }
    </script>
</body>
</html>
