<!DOCTYPE html>
<!--
  AWAKE // PONG
  ---------------------------------------------------------------
  A single-file, dependency-free screensaver that keeps an iPhone
  (or any modern browser) display from sleeping while it's open
  in the foreground.

  - Pure HTML/CSS/JS, no binary assets, no external requests.
  - Classic monochrome Pong palette (white-on-black / black-on-white),
    with a day/night toggle. Clock is rendered as real 7-segment
    LED digits in CSS, no font files needed.
  - One or more balls bounce freely off all four edges. Ball count
    and speed are adjustable and saved to localStorage.
  - Uses the Screen Wake Lock API (navigator.wakeLock).
  - Canvas rendering capped at 2x pixel density and ~30fps; "glow"
    is faked with layered low-alpha shapes instead of shadowBlur.

  Usage: open in Safari, tap "Activate", optionally
  Share -> Add to Home Screen for a full-screen app.

  License: MIT
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>AWAKE // PONG</title>
<script>
  // Apply saved theme before first paint to avoid a flash of the wrong theme.
  (function(){
    try{
      var t = localStorage.getItem('pongAwakeTheme');
      if(t === 'day') document.documentElement.setAttribute('data-theme', 'day');
    }catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#000000;
    --ink:#ffffff;
    --bg-rgb: 0,0,0;
    --ink-rgb: 255,255,255;
  }
  :root[data-theme="day"]{
    --bg:#f4f3ef;
    --ink:#111111;
    --bg-rgb: 244,243,239;
    --ink-rgb: 17,17,17;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }

  body{
    height:100dvh;
    overflow:hidden;
    position:fixed; inset:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    display:flex;
    flex-direction:column;
    transition: background-color .5s ease, color .5s ease;
  }

  /* ---------- background game canvas ---------- */
  #game{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    z-index:0;
  }

  /* ---------- CRT scanlines + vignette (static overlays, GPU-composited) ---------- */
  .scanlines{
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
    mix-blend-mode: multiply;
    opacity:0.5;
  }
  :root[data-theme="day"] .scanlines{ opacity:0.18; }

  .vignette{
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.7) 100%);
  }
  :root[data-theme="day"] .vignette{
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.16) 100%);
  }

  /* ---------- day / night toggle ---------- */
  .theme-toggle{
    position:absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left:50%;
    transform:translateX(-50%);
    z-index:3;
    appearance:none; -webkit-appearance:none;
    background:transparent;
    border: 2px solid var(--ink);
    opacity:0.35;
    border-radius: 999px;
    width:56px; height:30px;
    padding:3px;
    cursor:pointer;
    transition: opacity .25s ease, border-color .5s ease;
  }
  .theme-toggle:active{ opacity:0.7; }
  .theme-track{ position:relative; display:block; width:100%; height:100%; }
  .theme-thumb{
    position:absolute; top:50%; left:0;
    width:20px; height:20px;
    margin-top:-10px;
    border-radius:50%;
    background: var(--ink);
    transition: left .3s ease, background-color .5s ease;
  }
  :root[data-theme="day"] .theme-thumb{ left: calc(100% - 20px); }

  /* ---------- center clock ---------- */
  .hud{
    position:relative;
    flex:1;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    text-align:center;
    padding: 0 4vw;
    min-height:0;
  }

  /* 7-segment LED clock, built from CSS shapes (no font files) */
  .clock{
    --seg-on: var(--ink);
    --seg-off: var(--ink);
    font-size: clamp(2.4rem, 16vw, 6.5rem);
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 0.14em;
  }
  .digits{ display:flex; gap: 0.10em; }
  .digit{ position:relative; width:0.62em; height:1em; flex:0 0 auto; }

  .seg{
    position:absolute;
    background: var(--seg-off);
    opacity:0.06;
    transition: opacity .12s linear, background-color .5s ease, box-shadow .3s ease;
  }
  .seg.on{ background: var(--seg-on); opacity:1; }

  .seg-a, .seg-g, .seg-d{
    left:0.07em; width:0.48em; height:0.11em;
    clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%);
  }
  .seg-a{ top:0; }
  .seg-g{ top:0.445em; }
  .seg-d{ top:0.89em; }

  .seg-f, .seg-b, .seg-e, .seg-c{
    width:0.11em; height:0.445em;
    clip-path: polygon(0% 12%, 50% 0%, 100% 12%, 100% 88%, 50% 100%, 0% 88%);
  }
  .seg-f{ top:0.055em; left:0; }
  .seg-b{ top:0.055em; left:0.51em; }
  .seg-e{ top:0.505em; left:0; }
  .seg-c{ top:0.505em; left:0.51em; }

  .colon{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:1em; gap:0.18em; padding:0 0.02em;
  }
  .colon i{
    display:block; width:0.1em; height:0.1em; border-radius:50%;
    background: var(--ink); opacity:0.9;
    transition: background-color .5s ease, box-shadow .3s ease;
  }

  body.boosted .seg.on{
    box-shadow: 0 0 0.06em rgba(var(--ink-rgb),0.85), 0 0 0.18em rgba(var(--ink-rgb),0.35);
  }
  body.boosted .colon i{
    box-shadow: 0 0 0.06em rgba(var(--ink-rgb),0.85);
  }

  .ampm{
    margin-top: clamp(0.7rem, 3.5vh, 1.4rem);
    font-size: clamp(0.75rem, 3vw, 1.05rem);
    letter-spacing: 0.4em;
    font-weight:700;
    opacity:0.55;
  }

  .date{
    margin-top: clamp(0.4rem, 2vh, 0.9rem);
    font-size: clamp(0.7rem, 2.8vw, 1rem);
    letter-spacing: 0.35em;
    font-weight:700;
    opacity:0.4;
    text-transform:uppercase;
  }

  /* ---------- controls ---------- */
  .controls{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 10px;
    padding: 10px 6vw calc(env(safe-area-inset-bottom, 0px) + 18px);
  }

  .setting-row{
    width:min(420px, 86vw);
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .setting-label{
    font-size: clamp(0.6rem, 2.4vw, 0.78rem);
    letter-spacing:0.35em;
    font-weight:700;
    opacity:0.5;
    white-space:nowrap;
  }

  .balls-row{ justify-content:space-between; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .step-btn{
    appearance:none; -webkit-appearance:none;
    width:34px; height:34px;
    border:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
    border-radius:8px;
    font-size:1.1rem;
    font-weight:800;
    font-family:inherit;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .5s ease, background-color .25s ease, color .25s ease, opacity .2s ease;
  }
  .step-btn:active{ transform:scale(0.94); }
  .step-btn:disabled{ opacity:0.25; }
  #ballCount{
    min-width:1.6ch;
    text-align:center;
    font-size:1.15rem;
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }

  .speed-row input[type="range"]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:2px;
    background: rgba(var(--ink-rgb),0.25);
    border-radius:2px;
    outline:none;
  }
  .speed-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--ink);
    cursor:pointer;
    transition: background-color .5s ease;
  }
  .speed-row input[type="range"]::-moz-range-thumb{
    width:20px; height:20px;
    border:none;
    border-radius:50%;
    background: var(--ink);
    cursor:pointer;
    transition: background-color .5s ease;
  }
  #speedValue{
    min-width:3.4ch;
    text-align:right;
    font-size:0.85rem;
    font-weight:800;
    opacity:0.55;
    font-variant-numeric:tabular-nums;
  }

  .power-btn{
    appearance:none;
    -webkit-appearance:none;
    width: clamp(64px, 18vw, 84px);
    height: clamp(64px, 18vw, 84px);
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background-color .25s ease, border-color .5s ease, box-shadow .25s ease, transform .15s ease;
    margin-top:4px;
  }
  .power-btn:active{ transform: scale(0.94); }
  .power-btn svg{
    width:42%;
    height:42%;
    fill:none;
    stroke: var(--ink);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke .25s ease;
  }

  /* "Active" = fully inverted, like a lit arcade button */
  .power-btn.active{
    background: var(--ink);
    box-shadow:
      0 0 18px rgba(var(--ink-rgb),0.35),
      0 0 60px rgba(var(--ink-rgb),0.15);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .power-btn.active svg{ stroke: var(--bg); }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 18px rgba(var(--ink-rgb),0.35), 0 0 60px rgba(var(--ink-rgb),0.15); }
    50%{ box-shadow: 0 0 28px rgba(var(--ink-rgb),0.6), 0 0 90px rgba(var(--ink-rgb),0.3); }
  }

  .status{
    font-size: clamp(0.6rem, 2.6vw, 0.78rem);
    letter-spacing: 0.4em;
    text-transform:uppercase;
    font-weight:700;
    color: var(--ink);
    opacity:0.3;
    transition: opacity .4s ease, color .5s ease;
  }
  .status.on{ opacity:0.85; }

  @media (prefers-reduced-motion: reduce){
    .power-btn.active{ animation:none; }
  }
</style>
</head>
<body>

  <canvas id="game"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle day and night mode" aria-pressed="false">
    <span class="theme-track"><span class="theme-thumb"></span></span>
  </button>

  <div class="hud">
    <div class="clock">
      <div class="digits" id="hh"></div>
      <div class="colon"><i></i><i></i></div>
      <div class="digits" id="mm"></div>
    </div>
    <div id="ampm" class="ampm">AM</div>
    <div id="date" class="date">— — —</div>
  </div>

  <div class="controls">
    <div class="setting-row balls-row">
      <span class="setting-label">BALLS</span>
      <div class="stepper">
        <button id="ballsMinus" class="step-btn" type="button" aria-label="Remove a ball">&#8722;</button>
        <span id="ballCount">1</span>
        <button id="ballsPlus" class="step-btn" type="button" aria-label="Add a ball">+</button>
      </div>
    </div>

    <div class="setting-row speed-row">
      <span class="setting-label">SPEED</span>
      <input id="speedSlider" type="range" min="0.3" max="2.5" step="0.05" value="1" aria-label="Ball speed">
      <span id="speedValue">1.0&times;</span>
    </div>

    <button id="activateBtn" class="power-btn" type="button" aria-label="Toggle keep-awake">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3 V11"/>
        <path d="M6.5 6.5a8 8 0 1 0 11 0"/>
      </svg>
    </button>
    <div id="status" class="status">TAP TO STAY AWAKE</div>
  </div>

<script>
(function(){
  "use strict";

  // ============================================================
  //  THEME (day / night)
  // ============================================================
  var root = document.documentElement;
  var themeToggle = document.getElementById('themeToggle');
  var inkRGB = '255,255,255';
  var bgRGB  = '0,0,0';

  function readThemeColors(){
    var cs = getComputedStyle(root);
    inkRGB = cs.getPropertyValue('--ink-rgb').trim();
    bgRGB  = cs.getPropertyValue('--bg-rgb').trim();
  }

  function applyThemeUI(){
    var isDay = root.getAttribute('data-theme') === 'day';
    themeToggle.setAttribute('aria-pressed', isDay ? 'true' : 'false');
    readThemeColors();
  }

  themeToggle.addEventListener('click', function(){
    var isDay = root.getAttribute('data-theme') === 'day';
    if(isDay){
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', 'day');
    }
    try{ localStorage.setItem('pongAwakeTheme', isDay ? 'night' : 'day'); }catch(e){}
    applyThemeUI();
  });

  applyThemeUI();

  // ============================================================
  //  CANVAS — free-roaming bouncing balls
  //  Performance notes:
  //   - pixel ratio capped at 2 (Pro/Max phones report 3, which
  //     quadruples the pixel count for almost no visual gain)
  //   - render loop capped to ~30fps
  //   - "glow" = a few flat, low-alpha shapes instead of
  //     ctx.shadowBlur, which is extremely expensive on iOS
  // ============================================================
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d', { alpha: false });
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var boosted = false;
  var ballR = 8;
  var balls = [];

  var MIN_BALLS = 1;
  var MAX_BALLS = 12;
  var speedMul = 1;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ballR = Math.max(5, Math.min(W, H) * 0.014);
    for(var i=0; i<balls.length; i++){
      balls[i].x = clamp(balls[i].x, ballR, W - ballR);
      balls[i].y = clamp(balls[i].y, ballR, H - ballR);
    }
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function spawnBall(){
    var baseSpeed = Math.min(W, H) * 0.0042;
    var speed = baseSpeed * (0.7 + Math.random() * 0.6); // slight variety per ball
    var angle = Math.random() * Math.PI * 2;
    return {
      x: ballR + Math.random() * (W - ballR * 2),
      y: ballR + Math.random() * (H - ballR * 2),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed
    };
  }

  function setBallCount(n){
    n = clamp(n, MIN_BALLS, MAX_BALLS);
    while(balls.length < n) balls.push(spawnBall());
    while(balls.length > n) balls.pop();
    ballCountEl.textContent = n;
    ballsMinus.disabled = (n <= MIN_BALLS);
    ballsPlus.disabled = (n >= MAX_BALLS);
    try{ localStorage.setItem('pongAwakeBalls', n); }catch(e){}
  }

  function step(units){
    var move = units * speedMul;
    for(var i=0; i<balls.length; i++){
      var b = balls[i];
      b.x += b.vx * move;
      b.y += b.vy * move;
      if(b.x - ballR <= 0){ b.x = ballR; b.vx = Math.abs(b.vx); }
      if(b.x + ballR >= W){ b.x = W - ballR; b.vx = -Math.abs(b.vx); }
      if(b.y - ballR <= 0){ b.y = ballR; b.vy = Math.abs(b.vy); }
      if(b.y + ballR >= H){ b.y = H - ballR; b.vy = -Math.abs(b.vy); }
    }
  }

  // Cheap "glow": a couple of large, low-alpha fills under the
  // real shape instead of ctx.shadowBlur (no blur sampling at all).
  function drawGlowCircle(x, y, r, rgb, mul){
    ctx.fillStyle = 'rgba(' + rgb + ',' + (0.10 * mul) + ')';
    ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(' + rgb + ',' + (0.22 * mul) + ')';
    ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgb(' + rgb + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function draw(){
    var trailAlpha = boosted ? 0.16 : 0.24;
    var glowMul = boosted ? 1.4 : 1;

    // motion-trail fade (single fillRect, cheap)
    ctx.fillStyle = 'rgba(' + bgRGB + ',' + trailAlpha + ')';
    ctx.fillRect(0, 0, W, H);

    // center net (purely decorative, classic Pong reference)
    ctx.strokeStyle = 'rgba(' + inkRGB + ',0.14)';
    ctx.lineWidth = Math.max(1, W * 0.004);
    ctx.setLineDash([ctx.lineWidth * 2, ctx.lineWidth * 2]);
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    for(var i=0; i<balls.length; i++){
      drawGlowCircle(balls[i].x, balls[i].y, ballR, inkRGB, glowMul);
    }
  }

  var lastT = null;
  var acc = 0;
  var FRAME_MS = 1000 / 30; // ~30fps render cap
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(t){
    if(lastT === null) lastT = t;
    var dt = t - lastT;
    lastT = t;
    acc += dt;

    if(acc >= FRAME_MS){
      var elapsed = Math.min(acc, 100); // clamp big jumps (e.g. tab was hidden)
      if(!reducedMotion) step(elapsed * 0.06);
      draw();
      acc = 0;
    }
    requestAnimationFrame(frame);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      resize();
    }, 100);
  });

  // ---- ball count controls ----
  var ballCountEl = document.getElementById('ballCount');
  var ballsMinus = document.getElementById('ballsMinus');
  var ballsPlus = document.getElementById('ballsPlus');

  ballsMinus.addEventListener('click', function(){ setBallCount(balls.length - 1); });
  ballsPlus.addEventListener('click', function(){ setBallCount(balls.length + 1); });

  // ---- speed control ----
  var speedSlider = document.getElementById('speedSlider');
  var speedValueEl = document.getElementById('speedValue');

  function setSpeed(val){
    speedMul = clamp(val, parseFloat(speedSlider.min), parseFloat(speedSlider.max));
    speedValueEl.textContent = speedMul.toFixed(1) + '\u00D7';
    speedSlider.value = speedMul;
    try{ localStorage.setItem('pongAwakeSpeed', speedMul); }catch(e){}
  }

  speedSlider.addEventListener('input', function(){
    setSpeed(parseFloat(speedSlider.value));
  });

  // ---- init ----
  resize();

  var savedBalls = 1;
  try{
    var sb = parseInt(localStorage.getItem('pongAwakeBalls'), 10);
    if(!isNaN(sb)) savedBalls = sb;
  }catch(e){}
  setBallCount(savedBalls);

  var savedSpeed = 1;
  try{
    var ss = parseFloat(localStorage.getItem('pongAwakeSpeed'));
    if(!isNaN(ss)) savedSpeed = ss;
  }catch(e){}
  setSpeed(savedSpeed);

  ctx.fillStyle = 'rgb(' + bgRGB + ')';
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);

  // ============================================================
  //  CLOCK — real 7-segment LED digits built from <i> elements
  // ============================================================
  var SEGMENTS = {
    '0':'abcdef', '1':'bc',    '2':'abged', '3':'abgcd', '4':'fgbc',
    '5':'afgcd',  '6':'afgecd','7':'abc',   '8':'abcdefg','9':'abcdfg'
  };
  var SEG_NAMES = ['a','b','c','d','e','f','g'];

  function makeDigit(){
    var d = document.createElement('div');
    d.className = 'digit';
    for(var i=0; i<SEG_NAMES.length; i++){
      var s = document.createElement('i');
      s.className = 'seg seg-' + SEG_NAMES[i];
      d.appendChild(s);
    }
    return d;
  }

  function setDigit(el, ch){
    var segs = SEGMENTS[ch] || '';
    for(var i=0; i<SEG_NAMES.length; i++){
      var name = SEG_NAMES[i];
      var s = el.querySelector('.seg-' + name);
      if(segs.indexOf(name) > -1) s.classList.add('on');
      else s.classList.remove('on');
    }
  }

  var hhEl = document.getElementById('hh');
  var mmEl = document.getElementById('mm');
  var digits = {
    h1: makeDigit(), h2: makeDigit(),
    m1: makeDigit(), m2: makeDigit()
  };
  hhEl.appendChild(digits.h1); hhEl.appendChild(digits.h2);
  mmEl.appendChild(digits.m1); mmEl.appendChild(digits.m2);

  var ampmEl = document.getElementById('ampm');
  var dateEl = document.getElementById('date');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function pad3(n){ return n < 10 ? '00' + n : (n < 100 ? '0' + n : '' + n); }

  function isLeapYear(y){
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  // ISO-8601 week number (weeks start Monday, week 1 contains the first Thursday)
  function isoWeek(d){
    var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = date.getDay() || 7; // Mon=1 .. Sun=7
    date.setDate(date.getDate() + 4 - day);
    var yearStart = new Date(date.getFullYear(), 0, 1);
    return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
  }

  function dayOfYear(d){
    var start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }

  function tick(){
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    var hStr = pad(h12), mStr = pad(m);

    setDigit(digits.h1, hStr[0]);
    setDigit(digits.h2, hStr[1]);
    setDigit(digits.m1, mStr[0]);
    setDigit(digits.m2, mStr[1]);
    ampmEl.textContent = ampm;

    var yy = pad(now.getFullYear() % 100);
    var mo = pad(now.getMonth() + 1);
    var dd = pad(now.getDate());
    var wk = pad(isoWeek(now));
    var doy = pad3(dayOfYear(now));
    var totalDays = isLeapYear(now.getFullYear()) ? 366 : 365;

    dateEl.textContent = yy + '.' + mo + '.' + dd + ' \u00B7 WK' + wk + ' \u00B7 D' + doy + '/' + totalDays;
  }
  tick();
  setInterval(tick, 1000);

  // ============================================================
  //  WAKE LOCK
  //  Modern Safari (iOS 16.4+) supports navigator.wakeLock natively.
  //  No video/audio hacks needed.
  // ============================================================
  var btn = document.getElementById('activateBtn');
  var statusEl = document.getElementById('status');
  var supported = 'wakeLock' in navigator;

  var wakeLock = null;
  var isActive = false;

  function setUI(active){
    if(active){
      btn.classList.add('active');
      statusEl.textContent = 'SCREEN AWAKE — TAP TO SLEEP';
      statusEl.classList.add('on');
      document.body.classList.add('boosted');
      boosted = true;
    } else {
      btn.classList.remove('active');
      statusEl.textContent = supported ? 'TAP TO STAY AWAKE' : 'WAKE LOCK NOT SUPPORTED';
      statusEl.classList.remove('on');
      document.body.classList.remove('boosted');
      boosted = false;
    }
  }

  async function acquireWakeLock(){
    if(!supported) return;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){
        wakeLock = null;
      });
    }catch(e){
      wakeLock = null;
    }
  }

  function releaseWakeLock(){
    if(wakeLock){
      try{ wakeLock.release(); }catch(e){}
      wakeLock = null;
    }
  }

  btn.addEventListener('click', function(){
    isActive = !isActive;
    setUI(isActive);
    if(isActive){
      acquireWakeLock();
    } else {
      releaseWakeLock();
    }
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && isActive && !wakeLock){
      acquireWakeLock();
    }
  });

  if(!supported){
    statusEl.textContent = 'WAKE LOCK NOT SUPPORTED';
  }

})();
</script>
</body>
</html>
