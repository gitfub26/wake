function frame(t){const dt=clamp(t-last,0,50);last=t;({matrix:drawMatrix,pong:drawPong,rain:drawRain,wire:drawWire,stars:drawStars}[mode])(dt,cur());requestAnimationFrame(frame)}async function wake(){if(!("wakeLock"in navigator)){status("Wake lock unsupported","error");note("This browser does not expose Screen Wake Lock. Animations will continue.");return false}try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;if(wanted&&document.visibilityState==="visible")status("Wake lock released","error");else active()});return true}catch(e){status("Wake lock failed","error");note("Wake lock could not start: "+(e?.message||e?.name||"request rejected"));return false}}async function full(){try{if(document.fullscreenElement)return true;if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:"hide"});return!!document.fullscreenElement}note("Fullscreen is unavailable. The app will still fill the viewport.");return false}catch{note("Fullscreen was blocked. Wake mode can still run.");return false}}async function unfull(){try{if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen()}catch{}}function active(){const held=!!wl&&!wl.released;E.power.classList.toggle("active",wanted&&held);if(wanted&&held)status(document.fullscreenElement?"Awake · Fullscreen":"Awake · Viewport","active");else if(!wanted)status("Ready · Tap power")}E.power.onclick=async()=>{if(wanted){wanted=false;if(wl)try{await wl.release()}catch{}wl=null;await unfull();active();return}wanted=true;status("Activating…");const[ok]=await Promise.all([wake(),full()]);if(!ok)wanted=false;active()};document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&wanted&&!wl){await wake();active()}});document.addEventListener("fullscreenchange",active);addEventListener("resize",resize,{passive:true});addEventListener("orientationchange",()=>setTimeout(resize,180),{passive:true});applyTheme();clock();sync();resize();setInterval(clock,1000);requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)})})();
