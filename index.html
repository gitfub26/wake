<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Awake</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --fg:#fff;
  --muted:#8d8d94;
  --line:#ffffff2b;
  --panel:#000000d6;
  --soft:#ffffff14;
  --b:max(env(safe-area-inset-bottom),12px);
  --l:max(env(safe-area-inset-left),12px);
  --r:max(env(safe-area-inset-right),12px);
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
button,input{font:inherit;color:inherit}

#stars{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}

#vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle,transparent 38%,#0002 78%,#0009 100%);
}

#clock{
  position:fixed;
  z-index:3;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:100%;
  padding:0 20px;
  text-align:center;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 2px 22px #000,0 0 3px #000;
}
#time{
  font-size:clamp(48px,15vw,104px);
  font-weight:200;
  letter-spacing:-.055em;
  line-height:.9;
  font-variant-numeric:tabular-nums;
}
#date{
  margin-top:14px;
  font-size:clamp(14px,4vw,22px);
  opacity:.72;
}

#controls{
  position:fixed;
  z-index:8;
  left:var(--l);
  right:var(--r);
  bottom:calc(var(--b) + 82px);
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  transition:.28s ease;
}
#controls.hidden{
  transform:translateY(calc(100% + 14px));
  opacity:0;
  pointer-events:none;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.head strong{
  font-size:12px;
  letter-spacing:.03em;
}
.actions{
  display:flex;
  gap:14px;
}
.text{
  border:0;
  background:transparent;
  padding:4px 0;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
#reset{color:var(--fg)}

.sliders{
  display:grid;
  gap:8px;
}
.ctrl{
  display:grid;
  grid-template-columns:68px 1fr 34px;
  gap:8px;
  align-items:center;
}
.ctrl label,.ctrl output{
  font-size:10px;
  color:var(--muted);
}
.ctrl output{text-align:right}

input[type=range]{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  height:20px;
  background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;
  background:var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;
  height:16px;
  margin-top:-7px;
  border:0;
  border-radius:50%;
  background:var(--fg);
  box-shadow:0 0 0 4px var(--soft);
}

#show{
  position:fixed;
  z-index:9;
  left:50%;
  bottom:calc(var(--b) + 86px);
  transform:translateX(-50%);
  display:none;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
}
#show.visible{display:block}

#bottom{
  position:fixed;
  z-index:10;
  left:0;
  right:0;
  bottom:var(--b);
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
#power{
  position:relative;
  width:64px;
  height:64px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#000;
  display:grid;
  place-items:center;
  pointer-events:auto;
  box-shadow:0 10px 30px #0008;
}
#power svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
}
#power.active{
  background:var(--fg);
  color:var(--bg);
  box-shadow:0 0 0 5px var(--soft),0 0 34px var(--line);
}
#ring{
  position:absolute;
  inset:-5px;
  border:1px solid transparent;
  border-radius:50%;
}
#power.active #ring{
  border-color:var(--line);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  50%{transform:scale(1.08);opacity:.3}
}

#note{
  position:fixed;
  z-index:20;
  top:max(env(safe-area-inset-top),12px);
  left:50%;
  transform:translate(-50%,-8px);
  max-width:calc(100vw - 28px);
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  font-size:11px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}
#note.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media (orientation:landscape){
  #time{font-size:clamp(44px,10vw,82px)}
  #controls{
    left:calc(var(--l) + 5vw);
    right:calc(var(--r) + 5vw);
    bottom:calc(var(--b) + 62px);
  }
  .sliders{
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .ctrl{
    grid-template-columns:50px 1fr 26px;
  }
  #bottom{height:58px}
  #power{
    width:52px;
    height:52px;
  }
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="vignette"></div>

<div id="note"></div>

<div id="clock">
  <div id="time">12:00</div>
  <div id="date">Jul 20, 2026</div>
</div>

<section id="controls">
  <div class="head">
    <strong>Stars</strong>
    <div class="actions">
      <button id="reset" class="text" type="button">Reset</button>
      <button id="hide" class="text" type="button">Hide</button>
    </div>
  </div>
  <div class="sliders">
    <div class="ctrl">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0" max="100">
      <output id="speedOut"></output>
    </div>
    <div class="ctrl">
      <label for="intensity">Intensity</label>
      <input id="intensity" type="range" min="0" max="100">
      <output id="intensityOut"></output>
    </div>
    <div class="ctrl">
      <label for="brightness">Brightness</label>
      <input id="brightness" type="range" min="10" max="100">
      <output id="brightnessOut"></output>
    </div>
  </div>
</section>

<button id="show" type="button">Show Controls</button>

<div id="bottom">
  <button id="power" type="button" aria-label="Toggle wake mode">
    <span id="ring"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.8v8.4"></path>
      <path d="M7.15 5.75a8 8 0 1 0 9.7 0"></path>
    </svg>
  </button>
</div>

<script>
(()=>{
  "use strict";

  const $ = s => document.querySelector(s);
  const canvas = $("#stars");
  const ctx = canvas.getContext("2d", {alpha:false});

  const E = {
    note: $("#note"),
    power: $("#power"),
    controls: $("#controls"),
    show: $("#show"),
    hide: $("#hide"),
    reset: $("#reset"),
    speed: $("#speed"),
    intensity: $("#intensity"),
    brightness: $("#brightness"),
    speedOut: $("#speedOut"),
    intensityOut: $("#intensityOut"),
    brightnessOut: $("#brightnessOut"),
    time: $("#time"),
    date: $("#date")
  };

  const DEFAULTS = {speed:52,intensity:62,brightness:82};

  let prefs = {};
  try{
    prefs = JSON.parse(localStorage.getItem("awakeStarsPreferences") || "{}");
  }catch{}

  const settings = {
    speed: Number.isFinite(+prefs.speed) ? +prefs.speed : DEFAULTS.speed,
    intensity: Number.isFinite(+prefs.intensity) ? +prefs.intensity : DEFAULTS.intensity,
    brightness: Number.isFinite(+prefs.brightness) ? +prefs.brightness : DEFAULTS.brightness
  };

  let controlsHidden = !!prefs.controlsHidden;
  let w = 1, h = 1, dpr = 1;
  let stars = [];
  let last = performance.now();
  let wakeLock = null;
  let wakeWanted = false;
  let noteTimer = 0;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const rnd = (a,b) => a + Math.random() * (b-a);

  function save(){
    try{
      localStorage.setItem("awakeStarsPreferences", JSON.stringify({
        ...settings,
        controlsHidden
      }));
    }catch{}
  }

  function note(text, duration=3000){
    E.note.textContent = text;
    E.note.classList.add("show");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(()=>E.note.classList.remove("show"), duration);
  }

  function clear(){
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,w,h);
  }

  function makeStar(randomDepth=false){
    return {
      px:rnd(-w,w),
      py:rnd(-h,h),
      z:randomDepth ? rnd(1,w) : w,
      pz:w
    };
  }

  function initStars(){
    const count = Math.floor(80 + settings.intensity * 2.3);
    stars = Array.from({length:count}, ()=>makeStar(true));
  }

  function drawStars(dt){
    ctx.fillStyle = "rgba(0,0,0,.42)";
    ctx.fillRect(0,0,w,h);

    const cx = w/2;
    const cy = h/2;
    const movement = (45 + settings.speed * 6) * dt / 1000;

    ctx.lineCap = "round";

    for(const star of stars){
      star.pz = star.z;
      star.z -= movement;

      if(star.z < 1){
        Object.assign(star, makeStar(false));
      }

      const x = cx + star.px / star.z * w * .45;
      const y = cy + star.py / star.z * h * .45;
      const px = cx + star.px / star.pz * w * .45;
      const py = cy + star.py / star.pz * h * .45;

      if(x < 0 || x > w || y < 0 || y > h){
        Object.assign(star, makeStar(false));
        continue;
      }

      const depth = 1 - star.z / w;
      const alpha = clamp(depth * settings.brightness / 75, .08, 1);
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = clamp(depth * 3.2, .4, 3.2) * (.45 + settings.intensity / 120);
      ctx.beginPath();
      ctx.moveTo(px,py);
      ctx.lineTo(x,y);
      ctx.stroke();
    }
  }

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = Math.max(1, innerWidth);
    h = Math.max(1, innerHeight);

    canvas.width = Math.round(w*dpr);
    canvas.height = Math.round(h*dpr);
    canvas.style.width = w+"px";
    canvas.style.height = h+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
    clear();
    initStars();
  }

  function syncControls(){
    for(const name of ["speed","intensity","brightness"]){
      E[name].value = settings[name];
      E[name+"Out"].value = settings[name];
    }
    E.controls.classList.toggle("hidden", controlsHidden);
    E.show.classList.toggle("visible", controlsHidden);
  }

  function updateClock(){
    const now = new Date();
    E.time.textContent = now
      .toLocaleTimeString([], {hour:"numeric",minute:"2-digit",hour12:true})
      .replace(" AM","")
      .replace(" PM","");
    E.date.textContent = now.toLocaleDateString("en-US", {
      month:"short",
      day:"numeric",
      year:"numeric"
    });
  }

  for(const name of ["speed","intensity","brightness"]){
    E[name].addEventListener("input", ()=>{
      settings[name] = +E[name].value;
      E[name+"Out"].value = settings[name];

      if(name === "intensity"){
        initStars();
      }
      save();
    });
  }

  E.reset.addEventListener("click", ()=>{
    Object.assign(settings, DEFAULTS);
    initStars();
    syncControls();
    save();
    note("Star controls reset");
  });

  E.hide.addEventListener("click", ()=>{
    controlsHidden = true;
    syncControls();
    save();
  });

  E.show.addEventListener("click", ()=>{
    controlsHidden = false;
    syncControls();
    save();
  });

  async function acquireWakeLock(){
    if(!("wakeLock" in navigator)){
      note("Screen Wake Lock is not supported in this browser.");
      return false;
    }

    try{
      wakeLock = await navigator.wakeLock.request("screen");

      wakeLock.addEventListener("release", ()=>{
        wakeLock = null;
        updatePowerState();
      });

      return true;
    }catch(error){
      wakeLock = null;
      note("Wake lock could not start: " + (error?.message || error?.name || "request rejected"));
      return false;
    }
  }

  async function requestFullscreen(){
    try{
      if(document.fullscreenElement) return;
      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen({navigationUI:"hide"});
      }
    }catch{
      /* Fullscreen is optional. Wake mode still works without it. */
    }
  }

  async function exitFullscreen(){
    try{
      if(document.fullscreenElement && document.exitFullscreen){
        await document.exitFullscreen();
      }
    }catch{}
  }

  function updatePowerState(){
    const held = !!wakeLock && !wakeLock.released;
    E.power.classList.toggle("active", wakeWanted && held);
    E.power.setAttribute("aria-pressed", String(wakeWanted && held));
  }

  E.power.addEventListener("click", async ()=>{
    if(wakeWanted){
      wakeWanted = false;

      if(wakeLock){
        try{ await wakeLock.release(); }catch{}
        wakeLock = null;
      }

      await exitFullscreen();
      updatePowerState();
      return;
    }

    wakeWanted = true;

    const [wakeOK] = await Promise.all([
      acquireWakeLock(),
      requestFullscreen()
    ]);

    if(!wakeOK){
      wakeWanted = false;
    }

    updatePowerState();
  });

  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState === "visible" && wakeWanted && !wakeLock){
      const ok = await acquireWakeLock();
      if(!ok) wakeWanted = false;
      updatePowerState();
    }
  });

  document.addEventListener("fullscreenchange", updatePowerState);

  addEventListener("resize", resize, {passive:true});
  addEventListener("orientationchange", ()=>setTimeout(resize,180), {passive:true});

  function frame(t){
    const dt = clamp(t-last,0,50);
    last = t;
    drawStars(dt);
    requestAnimationFrame(frame);
  }

  updateClock();
  syncControls();
  resize();

  setInterval(updateClock,1000);
  requestAnimationFrame(t=>{
    last = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
